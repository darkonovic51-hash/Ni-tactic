<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأساتذة | أكاديمية النخبة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
.page-actions-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
.page-actions-btns{display:flex;gap:8px;flex-wrap:wrap;}
.mini-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
@media(max-width:800px){ .mini-stats-row{grid-template-columns:1fr 1fr;} }
.mini-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;text-align:center;}
.mini-stat b{display:block;font-size:19px;font-weight:800;}
.mini-stat span{font-size:10.8px;color:var(--text-muted);font-weight:600;}

.specialty-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.specialty-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11.5px;font-weight:700;cursor:pointer;}
.specialty-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.search-bar-wrap{position:relative;margin-bottom:14px;}
.search-bar-wrap i{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--text-muted);}
.search-bar-wrap input{width:100%;padding:14px 46px 14px 18px;border:1.5px solid var(--border);border-radius:12px;font-family:'Cairo',sans-serif;font-size:14px;background:var(--surface);box-shadow:var(--shadow-sm);}
.search-bar-wrap input:focus{outline:none;border-color:var(--accent);}

.filters-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;}
.filters-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
.filters-grid select{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Cairo',sans-serif;font-size:12.5px;background:var(--surface-soft);width:100%;}
.filters-actions{display:flex;gap:8px;justify-content:flex-end;}
@media(max-width:900px){ .filters-grid{grid-template-columns:1fr 1fr;} }

.view-toggle{display:flex;gap:4px;background:var(--surface-soft);border-radius:9px;padding:4px;}
.view-toggle button{padding:8px 14px;border-radius:7px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--text-muted);}
.view-toggle button.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm);font-weight:700;}
.toolbar-row{display:flex;justify-content:flex-end;margin-bottom:14px;}

/* GRID VIEW - teacher cards */
.teachers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.teacher-card{background:var(--surface);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:.2s;}
.teacher-card:hover{box-shadow:var(--shadow-md);border-color:var(--accent);}
.tc-top{display:flex;align-items:center;gap:12px;margin-bottom:13px;cursor:pointer;}
.tc-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--secondary),var(--primary-dark));color:var(--accent-light);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
.tc-name{font-size:14.5px;font-weight:800;}
.tc-subject{font-size:11.5px;color:var(--text-muted);}
.tc-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);padding:5px 0;border-top:1px dashed var(--border);}
.tc-row b{color:var(--text);font-weight:700;}
.tc-actions{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.tc-actions button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--surface-soft);cursor:pointer;font-size:11px;color:var(--text-muted);}
.tc-actions button:hover{border-color:var(--accent);color:var(--primary);}

.wide-modal{max-width:760px !important;}
.modal-section-title{display:flex;align-items:center;gap:10px;margin:22px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--surface-soft);}
.modal-section-title:first-child{margin-top:0;}
.modal-section-title i{width:32px;height:32px;background:var(--warning-soft);color:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;}
.modal-section-title h4{font-size:14.5px;font-weight:800;color:var(--primary);}

.drawer-overlay{position:fixed;inset:0;background:rgba(10,39,56,0.5);z-index:1900;display:none;}
.drawer-overlay.active{display:block;}
.drawer-panel{position:fixed;top:0;left:0;height:100%;width:520px;max-width:94vw;background:var(--surface);z-index:1950;box-shadow:var(--shadow-lg);transform:translateX(-100%);transition:.28s ease;overflow-y:auto;}
.drawer-panel.active{transform:translateX(0);}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:2;}
.drawer-close{background:none;border:none;font-size:18px;color:var(--text-muted);cursor:pointer;}
.drawer-body{padding:20px 22px;}
.profile-top{display:flex;gap:14px;align-items:center;margin-bottom:20px;}
.profile-avatar-lg{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--secondary),var(--primary-dark));color:var(--accent-light);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex-shrink:0;}
.assigned-class-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-soft);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;margin:3px;}
</style>
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-panel">
    <div class="topbar">
      <div class="topbar-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="topSearchInput" placeholder="بحث شامل..."></div>
      <div class="topbar-right">
        <div class="topbar-notif"><i class="fa-solid fa-bell"></i><span class="dot"></span></div>
        <div class="topbar-admin"><div class="topbar-admin-avatar">AD</div><div><span>المدير</span><small>admin</small></div></div>
      </div>
    </div>

    <div class="dash-content">
      <div class="breadcrumb"><a href="dashboard.html">الرئيسية</a><i class="fa-solid fa-chevron-left"></i><span>الأساتذة</span></div>

      <div class="page-actions-row">
        <div>
          <span class="demo-tag"><i class="fa-solid fa-flask"></i> بيانات تجريبية — Demo Data</span>
          <h2 style="font-size:22px;font-weight:800;">الأساتذة</h2>
          <p style="font-size:13px;color:var(--text-muted);">إدارة الملفات الإدارية للطاقم التربوي</p>
        </div>
        <div class="page-actions-btns">
          <button class="btn btn-outline btn-sm" onclick="exportTeachers()"><i class="fa-solid fa-file-export"></i> تصدير</button>
          <button class="btn btn-outline btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
          <a href="archive.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-box-archive"></i> أرشيف الأساتذة</a>
          <button class="btn btn-primary" onclick="openAddTeacherModal()"><i class="fa-solid fa-user-plus"></i> إضافة أستاذ</button>
        </div>
      </div>

      <!-- STATISTICS -->
      <div class="mini-stats-row" id="miniStatsRow"></div>

      <!-- SPECIALTY QUICK FILTER CHIPS -->
      <div class="specialty-row" id="specialtyRow"></div>

      <!-- SEARCH -->
      <div class="search-bar-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchBox" placeholder="ابحث بالاسم، الاسم بالفرنسية، الهاتف، البريد، التخصص، المادة...">
      </div>

      <!-- FILTERS -->
      <div class="filters-bar">
        <div class="filters-grid">
          <select id="filterStatus">
            <option value="">الحالة (الكل)</option>
            <option value="نشط">نشط</option><option value="غير نشط">غير نشط</option>
            <option value="في إجازة">في إجازة</option><option value="منتهي العقد">منتهي العقد</option>
          </select>
          <select id="filterSubject"><option value="">المادة (الكل)</option></select>
          <select id="filterSection"><option value="">القسم المسند (الكل)</option></select>
          <select id="filterContract"><option value="">نوع العقد (الكل)</option><option value="دوام كامل">دوام كامل</option><option value="دوام جزئي">دوام جزئي</option></select>
        </div>
        <div class="filters-actions">
          <button class="btn btn-ghost btn-sm" onclick="resetFilters()"><i class="fa-solid fa-rotate-left"></i> إعادة تعيين</button>
          <button class="btn btn-dark btn-sm" onclick="applyFilters()"><i class="fa-solid fa-filter"></i> تطبيق الفلاتر</button>
        </div>
      </div>

      <!-- VIEW TOGGLE -->
      <div class="toolbar-row">
        <div class="view-toggle">
          <button id="gridViewBtn" class="active" onclick="setView('grid')"><i class="fa-solid fa-grip"></i> شبكة</button>
          <button id="listViewBtn" onclick="setView('list')"><i class="fa-solid fa-list"></i> قائمة</button>
        </div>
      </div>

      <!-- GRID VIEW -->
      <div class="teachers-grid" id="teachersGrid"></div>

      <!-- LIST VIEW -->
      <div class="panel" id="teachersListPanel" style="display:none;">
        <div style="overflow-x:auto;">
          <table class="dtable">
            <thead><tr><th>الأستاذ</th><th>المادة</th><th>القسم المسند</th><th>الهاتف</th><th>نوع العقد</th><th>الحالة</th><th>إجراءات</th></tr></thead>
            <tbody id="teachersTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- ============ TEACHER PROFILE DRAWER ============ -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer-panel" id="drawerPanel">
  <div class="drawer-head"><h3>ملف الأستاذ</h3><button class="drawer-close" onclick="closeDrawer()"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<!-- ============ ADD / EDIT TEACHER MODAL ============ -->
<div class="modal-overlay" id="teacherFormModal">
  <div class="success-modal wide-modal" style="text-align:right;max-height:88vh;overflow-y:auto;">
    <h3 id="teacherFormTitle" style="margin-bottom:16px;">إضافة أستاذ جديد</h3>
    <form id="teacherForm">
      <input type="hidden" id="editingTeacherId">

      <div class="modal-section-title"><i class="fa-solid fa-id-card"></i><h4>المعلومات الشخصية</h4></div>
      <div class="form-grid">
        <div class="form-field" data-field="firstname"><label>الاسم <span class="req">*</span></label><input type="text" name="firstname"><span class="error-text">مطلوب</span></div>
        <div class="form-field" data-field="lastname"><label>اللقب <span class="req">*</span></label><input type="text" name="lastname"><span class="error-text">مطلوب</span></div>
        <div class="form-field"><label>الاسم بالفرنسية</label><input type="text" name="fullFr" class="ltr"></div>
        <div class="form-field"><label>تاريخ الميلاد</label><input type="date" name="dob"></div>
        <div class="form-field"><label>مكان الميلاد</label><input type="text" name="pob"></div>
        <div class="form-field"><label>الجنس</label><select name="gender"><option value="">اختر</option><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select></div>
        <div class="form-field" data-field="phone"><label>الهاتف <span class="req">*</span></label><input type="tel" name="phone" class="ltr" placeholder="0550000000"><span class="error-text">رقم غير صحيح</span></div>
        <div class="form-field"><label>هاتف إضافي</label><input type="tel" name="phone2" class="ltr"></div>
        <div class="form-field"><label>البريد الإلكتروني</label><input type="email" name="email" class="ltr"></div>
        <div class="form-field full"><label>العنوان</label><input type="text" name="address"></div>
      </div>

      <div class="modal-section-title"><i class="fa-solid fa-chalkboard-user"></i><h4>المعلومات المهنية</h4></div>
      <div class="form-grid">
        <div class="form-field" data-field="subject"><label>التخصص / المادة <span class="req">*</span></label><input type="text" name="subject" list="subjectSuggestions"><span class="error-text">مطلوب</span></div>
        <datalist id="subjectSuggestions"></datalist>
        <div class="form-field"><label>المؤهل العلمي</label><input type="text" name="qualification" placeholder="ليسانس/ماستر..."></div>
        <div class="form-field"><label>سنوات الخبرة</label><input type="number" name="experienceYears" min="0"></div>
        <div class="form-field" data-field="hireDate"><label>تاريخ التوظيف <span class="req">*</span></label><input type="date" name="hireDate"><span class="error-text">مطلوب</span></div>
        <div class="form-field"><label>نوع العقد</label><select name="contractType"><option>دوام كامل</option><option>دوام جزئي</option></select></div>
        <div class="form-field"><label>الحالة</label>
          <select name="status"><option value="نشط">نشط</option><option value="غير نشط">غير نشط</option><option value="في إجازة">في إجازة</option><option value="منتهي العقد">منتهي العقد</option></select>
        </div>
        <div class="form-field"><label>القسم الرئيسي المسند</label><select name="section" id="sectionSelectForm"></select></div>
        <div class="form-field full"><label>ملاحظات إدارية</label><textarea name="notes"></textarea></div>
      </div>

      <div style="display:flex;gap:10px;margin-top:20px;">
        <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center;" id="teacherFormSubmitBtn">حفظ الأستاذ</button>
        <button type="button" class="btn btn-danger" onclick="closeTeacherFormModal()">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<!-- Firebase (optional realtime sync layer — must load BEFORE shared.js) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="shared.js"></script>
<script>
EliteAcademy.auth.requireAuth();
EliteAcademy.navigation.renderSidebar('teachers');

const K = EliteAcademy.storage.keys;
const getData = EliteAcademy.storage.getData;

let currentView = 'grid';
let currentPage = 1;
const PAGE_SIZE = 12;
let filteredTeachers = [];
let activeSpecialtyFilter = '';

function initials(f,l){ return (f[0]||'') + (l[0]||''); }

/* ============ INIT DROPDOWNS ============ */
function initDropdowns(){
  const teachers = getData(K.teachers);
  const sections = getData(K.classes);
  const subjects = [...new Set(teachers.map(t => t.subject).filter(Boolean))];

  const fSubject = document.getElementById('filterSubject');
  subjects.forEach(s => fSubject.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));

  const fSection = document.getElementById('filterSection');
  sections.forEach(s => fSection.insertAdjacentHTML('beforeend', `<option value="${s.name}">${s.name}</option>`));

  const formSection = document.getElementById('sectionSelectForm');
  formSection.insertAdjacentHTML('beforeend', `<option value="">بدون تخصيص</option>`);
  sections.forEach(s => formSection.insertAdjacentHTML('beforeend', `<option value="${s.name}">${s.name}</option>`));

  const subjectSuggestions = document.getElementById('subjectSuggestions');
  subjects.forEach(s => subjectSuggestions.insertAdjacentHTML('beforeend', `<option value="${s}"></option>`));

  // Specialty quick chips (top N subjects)
  const specialtyRow = document.getElementById('specialtyRow');
  specialtyRow.innerHTML = `<span class="specialty-chip ${activeSpecialtyFilter===''?'active':''}" onclick="filterBySpecialty('')">الكل</span>` +
    subjects.map(s => `<span class="specialty-chip ${activeSpecialtyFilter===s?'active':''}" onclick="filterBySpecialty('${s}')">${s}</span>`).join('');
}

function filterBySpecialty(subject){
  activeSpecialtyFilter = subject;
  document.getElementById('filterSubject').value = subject;
  initDropdowns();
  applyFilters();
}

/* ============ STATISTICS ============ */
function renderStats(){
  const teachers = getData(K.teachers);
  const active = teachers.filter(t => (t.status||'نشط') === 'نشط');
  const inactive = teachers.filter(t => (t.status||'نشط') !== 'نشط' && (t.status||'') !== 'مؤرشف');
  const thisMonth = new Date().toISOString().slice(0,7);
  const newThisMonth = teachers.filter(t => t.hireDate && t.hireDate.startsWith(thisMonth)).length;

  const stats = [
    { label:'إجمالي الأساتذة', value:teachers.length },
    { label:'النشطون', value:active.length },
    { label:'غير النشطين', value:inactive.length },
    { label:'الجدد (هذا الشهر)', value:newThisMonth }
  ];
  document.getElementById('miniStatsRow').innerHTML = stats.map(s => `<div class="mini-stat"><b>${s.value}</b><span>${s.label}</span></div>`).join('');
}

/* ============ FILTERING ============ */
function getFilteredList(){
  const q = document.getElementById('searchBox').value.trim();
  const status = document.getElementById('filterStatus').value;
  const subject = document.getElementById('filterSubject').value;
  const section = document.getElementById('filterSection').value;
  const contract = document.getElementById('filterContract').value;

  let list = getData(K.teachers).filter(t => (t.status||'نشط') !== 'مؤرشف' || status === 'مؤرشف');

  if(q){
    const ql = q.toLowerCase();
    list = list.filter(t =>
      `${t.firstname} ${t.lastname}`.includes(q) ||
      (t.fullFr && t.fullFr.toLowerCase().includes(ql)) ||
      (t.phone && t.phone.includes(q)) ||
      (t.email && t.email.toLowerCase().includes(ql)) ||
      (t.subject && t.subject.includes(q)) ||
      t.id === q
    );
  }
  if(status) list = list.filter(t => (t.status||'نشط') === status);
  if(subject) list = list.filter(t => t.subject === subject);
  if(section) list = list.filter(t => t.section === section);
  if(contract) list = list.filter(t => t.contractType === contract);

  return list;
}

function applyFilters(){
  filteredTeachers = getFilteredList();
  currentPage = 1;
  renderCurrentView();
}
function resetFilters(){
  document.getElementById('searchBox').value = '';
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterSubject').value = '';
  document.getElementById('filterSection').value = '';
  document.getElementById('filterContract').value = '';
  activeSpecialtyFilter = '';
  initDropdowns();
  applyFilters();
}
document.getElementById('searchBox').addEventListener('input', applyFilters);

/* ============ VIEW TOGGLE ============ */
function setView(view){
  currentView = view;
  document.getElementById('gridViewBtn').classList.toggle('active', view==='grid');
  document.getElementById('listViewBtn').classList.toggle('active', view==='list');
  document.getElementById('teachersGrid').style.display = view==='grid' ? 'grid' : 'none';
  document.getElementById('teachersListPanel').style.display = view==='list' ? 'block' : 'none';
  renderCurrentView();
}
function renderCurrentView(){
  if(currentView === 'grid') renderGrid(); else renderList();
  renderPagination();
}

/* ============ GRID VIEW ============ */
function renderGrid(){
  const grid = document.getElementById('teachersGrid');
  if(filteredTeachers.length === 0){ grid.innerHTML = renderEmptyState(); return; }
  const start = (currentPage-1)*PAGE_SIZE;
  const pageItems = filteredTeachers.slice(start, start+PAGE_SIZE);

  grid.innerHTML = pageItems.map(t => `
    <div class="teacher-card">
      <div class="tc-top" onclick="openDrawer('${t.id}')">
        <div class="tc-avatar">${initials(t.firstname, t.lastname)}</div>
        <div>
          <div class="tc-name">${t.firstname} ${t.lastname}</div>
          <div class="tc-subject">${t.subject||'—'}</div>
        </div>
      </div>
      <div class="tc-row"><span>الهاتف</span><b class="ltr">${t.phone||'—'}</b></div>
      <div class="tc-row"><span>القسم المسند</span><b>${t.section||'—'}</b></div>
      <div class="tc-row"><span>الحالة</span><span class="badge ${statusBadge(t.status)}">${t.status||'نشط'}</span></div>
      <div class="tc-actions">
        <button onclick="openDrawer('${t.id}')"><i class="fa-solid fa-eye"></i> عرض</button>
        <button onclick="openEditTeacherModal('${t.id}')"><i class="fa-solid fa-pen"></i> تعديل</button>
        <button onclick="confirmArchiveTeacher('${t.id}')"><i class="fa-solid fa-box-archive"></i></button>
      </div>
    </div>
  `).join('');
}

/* ============ LIST VIEW ============ */
function renderList(){
  const tbody = document.getElementById('teachersTableBody');
  if(filteredTeachers.length === 0){ tbody.innerHTML = `<tr><td colspan="7">${renderEmptyState()}</td></tr>`; return; }
  const start = (currentPage-1)*PAGE_SIZE;
  const pageItems = filteredTeachers.slice(start, start+PAGE_SIZE);

  tbody.innerHTML = pageItems.map(t => `
    <tr>
      <td data-label="الأستاذ"><b>${t.firstname} ${t.lastname}</b></td>
      <td data-label="المادة">${t.subject||'—'}</td>
      <td data-label="القسم المسند">${t.section||'—'}</td>
      <td data-label="الهاتف" class="ltr">${t.phone||'—'}</td>
      <td data-label="نوع العقد">${t.contractType||'—'}</td>
      <td data-label="الحالة"><span class="badge ${statusBadge(t.status)}">${t.status||'نشط'}</span></td>
      <td data-label="إجراءات">
        <div class="row-actions">
          <button class="btn btn-sm btn-dark" onclick="openDrawer('${t.id}')"><i class="fa-solid fa-eye"></i></button>
          <button class="btn btn-sm btn-outline" onclick="openEditTeacherModal('${t.id}')"><i class="fa-solid fa-pen"></i></button>
          <button class="btn btn-sm btn-danger" onclick="confirmArchiveTeacher('${t.id}')"><i class="fa-solid fa-box-archive"></i></button>
        </div>
      </td>
    </tr>
  `).join('');
}

function statusBadge(status){
  const map = { 'نشط':'badge-accepted', 'غير نشط':'badge-archived', 'في إجازة':'badge-progress', 'منتهي العقد':'badge-rejected', 'مؤرشف':'badge-archived' };
  return map[status||'نشط'] || 'badge-accepted';
}

function renderEmptyState(){
  return `<div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-chalkboard-user"></i><p>لا يوجد أساتذة مطابقون للبحث أو الفلاتر</p>
    <button class="btn btn-dark btn-sm" onclick="resetFilters()">إعادة ضبط الفلاتر</button></div>`;
}

/* ============ PAGINATION ============ */
function renderPagination(){
  const pagEl = document.getElementById('pagination');
  const totalPages = Math.ceil(filteredTeachers.length / PAGE_SIZE);
  if(totalPages <= 1){ pagEl.innerHTML=''; return; }
  let html='';
  for(let i=1;i<=totalPages;i++) html += `<button class="${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
  pagEl.innerHTML = html;
}
function goToPage(p){ currentPage=p; renderCurrentView(); }

/* ============ PROFILE DRAWER ============ */
function openDrawer(id){
  const t = EliteAcademy.storage.findById(K.teachers, id);
  if(!t) return;

  const documents = getData(K.documents).filter(d => d.teacherId === id);
  const logs = getData(K.logs).filter(l => l.entityId === id);

  document.getElementById('drawerBody').innerHTML = `
    <div class="profile-top">
      <div class="profile-avatar-lg">${initials(t.firstname,t.lastname)}</div>
      <div>
        <div style="font-size:17px;font-weight:800;">${t.firstname} ${t.lastname}</div>
        <div style="font-size:12px;color:var(--text-muted);direction:ltr;">${t.fullFr||''}</div>
        <span class="badge ${statusBadge(t.status)}" style="margin-top:6px;display:inline-block;">${t.status||'نشط'}</span>
      </div>
    </div>

    <h4 style="font-size:13.5px;margin-bottom:10px;">المعلومات الشخصية</h4>
    <div class="info-grid-2" style="margin-bottom:20px;">
      <div class="info-item"><span>تاريخ الميلاد</span><b>${t.dob ? EliteAcademy.utils.formatDate(t.dob) : '—'}</b></div>
      <div class="info-item"><span>مكان الميلاد</span><b>${t.pob||'—'}</b></div>
      <div class="info-item"><span>الجنس</span><b>${t.gender||'—'}</b></div>
      <div class="info-item"><span>الهاتف</span><b class="ltr">${t.phone||'—'}</b></div>
      <div class="info-item"><span>هاتف إضافي</span><b class="ltr">${t.phone2||'—'}</b></div>
      <div class="info-item"><span>البريد الإلكتروني</span><b class="ltr">${t.email||'—'}</b></div>
      <div class="info-item" style="grid-column:1/-1;"><span>العنوان</span><b>${t.address||'—'}</b></div>
    </div>

    <h4 style="font-size:13.5px;margin-bottom:10px;">المعلومات المهنية</h4>
    <div class="info-grid-2" style="margin-bottom:20px;">
      <div class="info-item"><span>التخصص / المادة</span><b>${t.subject||'—'}</b></div>
      <div class="info-item"><span>المؤهل العلمي</span><b>${t.qualification||'—'}</b></div>
      <div class="info-item"><span>سنوات الخبرة</span><b>${t.experienceYears||'—'}</b></div>
      <div class="info-item"><span>تاريخ التوظيف</span><b>${t.hireDate ? EliteAcademy.utils.formatDate(t.hireDate) : '—'}</b></div>
      <div class="info-item"><span>نوع العقد</span><b>${t.contractType||'—'}</b></div>
      <div class="info-item"><span>الحالة</span><b>${t.status||'نشط'}</b></div>
    </div>

    <h4 style="font-size:13.5px;margin-bottom:10px;">الأقسام المسندة</h4>
    <div style="margin-bottom:20px;">
      ${t.section ? `<span class="assigned-class-chip"><i class="fa-solid fa-door-open"></i> ${t.section}</span>` : `<p style="font-size:11.5px;color:var(--text-muted);">لا يوجد قسم مسند حاليًا</p>`}
    </div>

    <h4 style="font-size:13.5px;margin-bottom:10px;">الوثائق</h4>
    <div style="margin-bottom:20px;">
      ${documents.length ? documents.map(d=>`<span class="assigned-class-chip"><i class="fa-solid fa-file"></i> ${d.name||d.type}</span>`).join('') : `<p style="font-size:11.5px;color:var(--text-muted);">لا توجد وثائق مرتبطة — يمكن إضافتها من صفحة الوثائق</p>`}
      <div style="margin-top:8px;"><a href="documents.html" class="btn btn-sm btn-outline"><i class="fa-solid fa-folder-open"></i> إدارة الوثائق</a></div>
    </div>

    ${t.notes ? `<h4 style="font-size:13.5px;margin-bottom:10px;">ملاحظات إدارية</h4><p style="font-size:12.5px;color:var(--text-muted);margin-bottom:20px;">${t.notes}</p>` : ''}

    <h4 style="font-size:13.5px;margin-bottom:10px;">السجل الإداري</h4>
    <div>
      ${logs.length ? logs.slice(0,8).map(l=>`<div class="timeline-item" style="margin-bottom:8px;"><p style="font-size:12px;font-weight:700;">${l.description}</p><span style="font-size:10.5px;color:var(--text-muted);">${l.date} — ${l.time}</span></div>`).join('') : `<p style="font-size:11.5px;color:var(--text-muted);">لا يوجد سجل بعد</p>`}

  document.getElementById('drawerPanel').classList.add('active');
}
function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('active');
  document.getElementById('drawerPanel').classList.remove('active');
}

/* ============ ARCHIVE ============ */
function confirmArchiveTeacher(id){
  const t = EliteAcademy.storage.findById(K.teachers, id);
  EliteAcademy.modal.confirmAction(
    `سيتم أرشفة الأستاذ "${t.firstname} ${t.lastname}". يمكن استعادته لاحقًا مع الاحتفاظ بكامل سجله.`,
    () => {
      EliteAcademy.storage.archiveRecord(K.teachers, id, 'أرشفة يدوية');
      EliteAcademy.notifications.showSuccess('تمت أرشفة الأستاذ بنجاح');
      closeDrawer();
      refreshAll();
    },
    { title:'تأكيد الأرشفة', confirmLabel:'أرشفة' }
  );
}

/* ============ ADD / EDIT TEACHER MODAL ============ */
function openAddTeacherModal(){
  document.getElementById('teacherForm').reset();
  document.getElementById('editingTeacherId').value = '';
  document.getElementById('teacherFormTitle').textContent = 'إضافة أستاذ جديد';
  document.getElementById('teacherFormSubmitBtn').textContent = 'حفظ الأستاذ';
  clearFormErrors(document.getElementById('teacherForm'));
  document.getElementById('teacherFormModal').classList.add('active');
}

function openEditTeacherModal(id){
  const t = EliteAcademy.storage.findById(K.teachers, id);
  if(!t) return;
  const form = document.getElementById('teacherForm');
  form.reset();
  clearFormErrors(form);

  document.getElementById('editingTeacherId').value = id;
  document.getElementById('teacherFormTitle').textContent = `تعديل ملف: ${t.firstname} ${t.lastname}`;
  document.getElementById('teacherFormSubmitBtn').textContent = 'حفظ التعديلات';

  form.firstname.value = t.firstname;
  form.lastname.value = t.lastname;
  form.fullFr.value = t.fullFr || '';
  form.dob.value = t.dob || '';
  form.pob.value = t.pob || '';
  form.gender.value = t.gender || '';
  form.phone.value = t.phone || '';
  form.phone2.value = t.phone2 || '';
  form.email.value = t.email || '';
  form.address.value = t.address || '';
  form.subject.value = t.subject || '';
  form.qualification.value = t.qualification || '';
  form.experienceYears.value = t.experienceYears || '';
  form.hireDate.value = t.hireDate || '';
  form.contractType.value = t.contractType || 'دوام كامل';
  form.status.value = t.status || 'نشط';
  form.section.value = t.section || '';
  form.notes.value = t.notes || '';

  document.getElementById('teacherFormModal').classList.add('active');
}
function closeTeacherFormModal(){ document.getElementById('teacherFormModal').classList.remove('active'); }
function clearFormErrors(form){ form.querySelectorAll('.form-field[data-field]').forEach(f=>f.classList.remove('has-error')); }

document.getElementById('teacherForm').addEventListener('submit', function(e){
  e.preventDefault();
  clearFormErrors(this);
  let valid = true;
  ['firstname','lastname','phone','subject','hireDate'].forEach(name => {
    const input = this.querySelector(`[name="${name}"]`);
    if(EliteAcademy.utils.isEmpty(input.value)){ input.closest('.form-field').classList.add('has-error'); valid=false; }
  });
  const phoneInput = this.querySelector('[name="phone"]');
  if(!EliteAcademy.utils.isEmpty(phoneInput.value) && !EliteAcademy.utils.validatePhone(phoneInput.value)){ phoneInput.closest('.form-field').classList.add('has-error'); valid=false; }
  if(!valid){ EliteAcademy.notifications.showError('يرجى تصحيح الحقول المظللة'); return; }

  const data = EliteAcademy.utils.serializeForm(this);
  const editingId = document.getElementById('editingTeacherId').value;

  const payload = {
    firstname:data.firstname, lastname:data.lastname, fullFr:data.fullFr||'',
    dob:data.dob||'', pob:data.pob||'', gender:data.gender||'',
    phone:data.phone, phone2:data.phone2||'', email:data.email||'', address:data.address||'',
    subject:data.subject, qualification:data.qualification||'', experienceYears:data.experienceYears||'',
    hireDate:data.hireDate, contractType:data.contractType, status:data.status, section:data.section||'', notes:data.notes||''
  };

  if(editingId){
    EliteAcademy.storage.updateRecord(K.teachers, editingId, payload);
    EliteAcademy.utils.logAction('update','teachers', editingId, `تم تعديل ملف الأستاذ ${data.firstname} ${data.lastname}`, 'info');
    EliteAcademy.notifications.showSuccess('تم حفظ التعديلات بنجاح');
  } else {
    const teacher = EliteAcademy.storage.saveRecord(K.teachers, { ...payload, isDemo:false });
    EliteAcademy.utils.logAction('create','teachers', teacher.id, `تمت إضافة الأستاذ ${data.firstname} ${data.lastname} (${data.subject})`, 'success');
    EliteAcademy.notifications.showSuccess('تمت إضافة الأستاذ بنجاح');
  }

  closeTeacherFormModal();
  initDropdowns();
  refreshAll();
});

/* ============ EXPORT ============ */
function exportTeachers(){
  const blob = new Blob([JSON.stringify(getData(K.teachers), null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'teachers.json'; a.click();
  URL.revokeObjectURL(url);
  EliteAcademy.notifications.showSuccess('تم تصدير بيانات الأساتذة بنجاح');
}

/* ============ REFRESH ============ */
function refreshAll(){
  renderStats();
  filteredTeachers = getFilteredList();
  renderCurrentView();
}

/* ============ INIT ============ */
initDropdowns();
refreshAll();
</script>
</body>
</html>
