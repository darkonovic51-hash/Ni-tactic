<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أولياء الأمور | أكاديمية النخبة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
.page-actions-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
.page-actions-btns{display:flex;gap:8px;flex-wrap:wrap;}
.mini-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
@media(max-width:800px){ .mini-stats-row{grid-template-columns:1fr 1fr;} }
.mini-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;text-align:center;}
.mini-stat b{display:block;font-size:19px;font-weight:800;}
.mini-stat span{font-size:10.8px;color:var(--text-muted);font-weight:600;}

.search-bar-wrap{position:relative;margin-bottom:14px;}
.search-bar-wrap i{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--text-muted);}
.search-bar-wrap input{width:100%;padding:14px 46px 14px 18px;border:1.5px solid var(--border);border-radius:12px;font-family:'Cairo',sans-serif;font-size:14px;background:var(--surface);box-shadow:var(--shadow-sm);}
.search-bar-wrap input:focus{outline:none;border-color:var(--accent);}

.filters-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;}
.filters-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
.filters-grid select{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Cairo',sans-serif;font-size:12.5px;background:var(--surface-soft);width:100%;}
.filters-actions{display:flex;gap:8px;justify-content:flex-end;}

.student-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-soft);border:1px solid var(--border);border-radius:20px;padding:4px 10px 4px 4px;font-size:11px;font-weight:700;cursor:pointer;margin:2px;}
.student-chip:hover{border-color:var(--accent);}
.student-chip .chip-avatar{width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.phone-actions{display:inline-flex;gap:4px;margin-right:6px;}
.phone-actions button{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:11px;padding:2px 4px;}
.phone-actions button:hover{color:var(--primary);}

/* PROFILE DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(10,39,56,0.5);z-index:1900;display:none;}
.drawer-overlay.active{display:block;}
.drawer-panel{position:fixed;top:0;left:0;height:100%;width:540px;max-width:94vw;background:var(--surface);z-index:1950;box-shadow:var(--shadow-lg);transform:translateX(-100%);transition:.28s ease;overflow-y:auto;}
.drawer-panel.active{transform:translateX(0);}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:2;}
.drawer-head h3{font-size:16px;}
.drawer-close{background:none;border:none;font-size:18px;color:var(--text-muted);cursor:pointer;}
.drawer-body{padding:20px 22px;}

.parent-profile-top{display:flex;gap:14px;align-items:center;margin-bottom:20px;}
.parent-profile-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:var(--accent-light);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex-shrink:0;}

.linked-student-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:13px 15px;margin-bottom:10px;cursor:pointer;transition:.15s;}
.linked-student-card:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}
.lsc-avatar{width:38px;height:38px;border-radius:50%;background:var(--surface-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0;}
.lsc-name{font-size:13px;font-weight:700;}
.lsc-meta{font-size:11px;color:var(--text-muted);}
.lsc-card{margin-right:auto;font-size:11px;color:var(--text-muted);direction:ltr;}

.parent-fin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
@media(max-width:500px){ .parent-fin-grid{grid-template-columns:1fr;} }
.pfin-box{border-radius:var(--radius-md);padding:14px;border:1px solid var(--border);text-align:center;}
.pfin-box.paid{background:var(--success-soft);}
.pfin-box.remaining{background:var(--danger-soft);}
.pfin-box span{display:block;font-size:10.5px;color:var(--text-muted);margin-bottom:3px;}
.pfin-box b{font-size:15px;}

@media(max-width:900px){ .filters-grid{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-panel">
    <div class="topbar">
      <div class="topbar-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="topSearchInput" placeholder="بحث شامل..."></div>
      <div class="topbar-right">
        <div class="topbar-notif"><i class="fa-solid fa-bell"></i><span class="dot"></span></div>
        <div class="topbar-admin"><div class="topbar-admin-avatar">AD</div><div><span>المدير</span><small>admin</small></div></div>
      </div>
    </div>

    <div class="dash-content">
      <div class="breadcrumb"><a href="dashboard.html">الرئيسية</a><i class="fa-solid fa-chevron-left"></i><span>أولياء الأمور</span></div>

      <div class="page-actions-row">
        <div>
          <span class="demo-tag"><i class="fa-solid fa-flask"></i> بيانات تجريبية — Demo Data</span>
          <h2 style="font-size:22px;font-weight:800;">أولياء الأمور</h2>
          <p style="font-size:13px;color:var(--text-muted);">إدارة بيانات أولياء الأمور وربطها بالطلبة</p>
        </div>
        <div class="page-actions-btns">
          <button class="btn btn-outline btn-sm" onclick="exportParents()"><i class="fa-solid fa-file-export"></i> تصدير</button>
          <button class="btn btn-outline btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
          <button class="btn btn-primary" onclick="openAddParentModal()"><i class="fa-solid fa-user-plus"></i> إضافة ولي أمر</button>
        </div>
      </div>

      <!-- STATISTICS -->
      <div class="mini-stats-row" id="miniStatsRow"></div>

      <!-- SEARCH -->
      <div class="search-bar-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchBox" placeholder="ابحث بالاسم، الهاتف، البريد، اسم التلميذ، رقم البطاقة...">
      </div>

      <!-- FILTERS -->
      <div class="filters-bar">
        <div class="filters-grid">
          <select id="filterChildrenCount">
            <option value="">عدد الأبناء (الكل)</option>
            <option value="1">طالب واحد</option>
            <option value="2+">أكثر من طالب</option>
          </select>
          <select id="filterLevel"><option value="">المستوى المرتبط (الكل)</option></select>
          <select id="filterSection"><option value="">القسم المرتبط (الكل)</option></select>
          <select id="filterStatus"><option value="">الحالة (الكل)</option><option value="نشط">نشط</option><option value="مؤرشف">مؤرشف</option></select>
        </div>
        <div class="filters-actions">
          <button class="btn btn-ghost btn-sm" onclick="resetFilters()"><i class="fa-solid fa-rotate-left"></i> إعادة تعيين</button>
          <button class="btn btn-dark btn-sm" onclick="applyFilters()"><i class="fa-solid fa-filter"></i> تطبيق الفلاتر</button>
        </div>
      </div>

      <!-- TABLE -->
      <div class="panel">
        <div style="overflow-x:auto;">
          <table class="dtable">
            <thead><tr>
              <th>الولي</th><th>صلة القرابة</th><th>الهاتف</th><th>البريد الإلكتروني</th>
              <th>عدد الطلبة</th><th>الطلبة المرتبطون</th><th>الحالة</th><th>إجراءات</th>
            </tr></thead>
            <tbody id="parentsTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- ============ PARENT PROFILE DRAWER ============ -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer-panel" id="drawerPanel">
  <div class="drawer-head">
    <h3>ملف ولي الأمر</h3>
    <button class="drawer-close" onclick="closeDrawer()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<!-- ============ ADD / EDIT PARENT MODAL ============ -->
<div class="modal-overlay" id="parentFormModal">
  <div class="success-modal wide-modal" style="text-align:right;max-height:88vh;overflow-y:auto;">
    <h3 id="parentFormTitle" style="margin-bottom:16px;">إضافة ولي أمر جديد</h3>
    <form id="parentForm">
      <input type="hidden" id="editingParentId">
      <div class="form-grid">
        <div class="form-field" data-field="firstname"><label>الاسم <span class="req">*</span></label><input type="text" name="firstname"><span class="error-text">مطلوب</span></div>
        <div class="form-field" data-field="lastname"><label>اللقب <span class="req">*</span></label><input type="text" name="lastname"><span class="error-text">مطلوب</span></div>
        <div class="form-field"><label>صلة القرابة</label><select name="relation"><option value="الأب">الأب</option><option value="الأم">الأم</option><option value="آخر">آخر</option></select></div>
        <div class="form-field"><label>المهنة</label><input type="text" name="job"></div>
        <div class="form-field" data-field="phone"><label>الهاتف <span class="req">*</span></label><input type="tel" name="phone" class="ltr" placeholder="0550000000"><span class="error-text">رقم غير صحيح</span></div>
        <div class="form-field"><label>هاتف إضافي</label><input type="tel" name="phone2" class="ltr"></div>
        <div class="form-field"><label>البريد الإلكتروني</label><input type="email" name="email" class="ltr"></div>
        <div class="form-field full"><label>العنوان</label><input type="text" name="address"></div>
        <div class="form-field full"><label>ملاحظات</label><textarea name="notes"></textarea></div>
      </div>

      <div class="modal-section-title"><i class="fa-solid fa-link"></i><h4>ربط الطلبة الحاليين (اختياري)</h4></div>
      <div class="form-field" style="margin-bottom:8px;">
        <input type="text" id="linkStudentSearch" placeholder="ابحث عن طالب بالاسم أو رقم البطاقة لربطه بهذا الولي...">
      </div>
      <div id="linkStudentResults" style="font-size:12.5px;max-height:120px;overflow-y:auto;margin-bottom:6px;"></div>
      <div id="linkedStudentsPreview"></div>

      <div style="display:flex;gap:10px;margin-top:20px;">
        <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center;" id="parentFormSubmitBtn">حفظ ولي الأمر</button>
        <button type="button" class="btn btn-danger" onclick="closeParentFormModal()">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<!-- Firebase (optional realtime sync layer — must load BEFORE shared.js) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="shared.js"></script>
<script>
EliteAcademy.auth.requireAuth();
EliteAcademy.navigation.renderSidebar('parents');

const K = EliteAcademy.storage.keys;
const getData = EliteAcademy.storage.getData;

let filteredParents = [];
let currentPage = 1;
const PAGE_SIZE = 10;
let currentDrawerParentId = null;
let pendingLinkedStudentIds = [];

function initials(f,l){ return (f[0]||'') + (l[0]||''); }

/* ============ INIT FILTER DROPDOWNS ============ */
function initDropdowns(){
  const levels = getData(K.levels);
  const sections = getData(K.classes);
  const fLevel = document.getElementById('filterLevel');
  levels.forEach(l => fLevel.insertAdjacentHTML('beforeend', `<option value="${l.name}">${l.name}</option>`));
  const fSection = document.getElementById('filterSection');
  sections.forEach(s => fSection.insertAdjacentHTML('beforeend', `<option value="${s.name}">${s.name}</option>`));
}

/* ============ LINKED STUDENTS HELPER ============ */
function getLinkedStudents(parentId){
  return getData(K.students).filter(s => s.parentId === parentId);
}

/* ============ STATISTICS ============ */
function renderStats(){
  const parents = getData(K.parents);
  const students = getData(K.students);

  const active = parents.filter(p => p.status !== 'مؤرشف');
  const multiChild = parents.filter(p => getLinkedStudents(p.id).length > 1);
  const needsUpdate = parents.filter(p => EliteAcademy.utils.isEmpty(p.email) || EliteAcademy.utils.isEmpty(p.address));

  const stats = [
    { label:'إجمالي أولياء الأمور', value:parents.length },
    { label:'أولياء الأمور النشطون', value:active.length },
    { label:'لديهم أكثر من طالب', value:multiChild.length },
    { label:'بيانات تحتاج تحديث', value:needsUpdate.length }
  ];
  document.getElementById('miniStatsRow').innerHTML = stats.map(s => `<div class="mini-stat"><b>${s.value}</b><span>${s.label}</span></div>`).join('');
}

/* ============ FILTERING ============ */
function getFilteredList(){
  const q = document.getElementById('searchBox').value.trim();
  const childrenFilter = document.getElementById('filterChildrenCount').value;
  const level = document.getElementById('filterLevel').value;
  const section = document.getElementById('filterSection').value;
  const status = document.getElementById('filterStatus').value;

  const students = getData(K.students);
  let list = getData(K.parents);

  if(q){
    const ql = q.toLowerCase();
    list = list.filter(p => {
      const linkedStudents = getLinkedStudents(p.id);
      return `${p.firstname} ${p.lastname}`.includes(q) ||
        (p.phone && p.phone.includes(q)) ||
        (p.phone2 && p.phone2.includes(q)) ||
        (p.email && p.email.toLowerCase().includes(ql)) ||
        linkedStudents.some(s => `${s.firstname} ${s.lastname}`.includes(q) || s.cardNumber.includes(q));
    });
  }

  if(childrenFilter){
    list = list.filter(p => {
      const count = getLinkedStudents(p.id).length;
      return childrenFilter === '2+' ? count >= 2 : count === 1;
    });
  }
  if(level) list = list.filter(p => getLinkedStudents(p.id).some(s => s.level === level));
  if(section) list = list.filter(p => getLinkedStudents(p.id).some(s => s.section === section));
  if(status) list = list.filter(p => (p.status || 'نشط') === status);

  return list;
}

function applyFilters(){
  filteredParents = getFilteredList();
  currentPage = 1;
  renderTable();
}
function resetFilters(){
  document.getElementById('searchBox').value = '';
  document.getElementById('filterChildrenCount').value = '';
  document.getElementById('filterLevel').value = '';
  document.getElementById('filterSection').value = '';
  document.getElementById('filterStatus').value = '';
  applyFilters();
}
document.getElementById('searchBox').addEventListener('input', applyFilters);

/* ============ TABLE ============ */
function copyPhone(phone, e){
  e.stopPropagation();
  navigator.clipboard.writeText(phone).then(() => EliteAcademy.notifications.showSuccess('تم نسخ رقم الهاتف'));
}

function renderTable(){
  const tbody = document.getElementById('parentsTableBody');
  if(filteredParents.length === 0){
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="fa-solid fa-people-roof"></i><p>لا يوجد أولياء أمور مطابقون</p>
      <button class="btn btn-dark btn-sm" onclick="resetFilters()">إعادة ضبط الفلاتر</button></div></td></tr>`;
    document.getElementById('pagination').innerHTML='';
    return;
  }

  const start = (currentPage-1)*PAGE_SIZE;
  const pageItems = filteredParents.slice(start, start+PAGE_SIZE);

  tbody.innerHTML = pageItems.map(p => {
    const linkedStudents = getLinkedStudents(p.id);
    const chips = linkedStudents.slice(0,3).map(s => `
      <span class="student-chip" onclick="event.stopPropagation(); window.location.href='student-profile.html?id=${s.id}'">
        <span class="chip-avatar">${initials(s.firstname,s.lastname)}</span> ${s.firstname}
      </span>`).join('');
    const extra = linkedStudents.length > 3 ? `<span class="student-chip">+${linkedStudents.length-3}</span>` : '';

    return `
    <tr style="cursor:pointer;" onclick="openDrawer('${p.id}')">
      <td data-label="الولي"><b>${p.firstname} ${p.lastname}</b></td>
      <td data-label="صلة القرابة">${p.relation||'—'}</td>
      <td data-label="الهاتف" onclick="event.stopPropagation();">
        <span class="ltr">${p.phone}</span>
        <span class="phone-actions">
          <button onclick="callPhone('${p.phone}', event)" title="اتصال"><i class="fa-solid fa-phone"></i></button>
          <button onclick="copyPhone('${p.phone}', event)" title="نسخ"><i class="fa-solid fa-copy"></i></button>
        </span>
      </td>
      <td data-label="البريد الإلكتروني" class="ltr">${p.email || '—'}</td>
      <td data-label="عدد الطلبة"><b>${linkedStudents.length}</b></td>
      <td data-label="الطلبة المرتبطون">${chips}${extra}</td>
      <td data-label="الحالة"><span class="badge ${(p.status||'نشط')==='مؤرشف'?'badge-archived':'badge-accepted'}">${p.status||'نشط'}</span></td>
      <td data-label="إجراءات" onclick="event.stopPropagation();">
        <div class="row-actions">
          <button class="btn btn-sm btn-dark" onclick="openDrawer('${p.id}')"><i class="fa-solid fa-eye"></i></button>
          <button class="btn btn-sm btn-outline" onclick="openEditParentModal('${p.id}')"><i class="fa-solid fa-pen"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('');

  renderPagination();
}

function callPhone(phone, e){ e.stopPropagation(); window.location.href = `tel:${phone.replace(/\s/g,'')}`; }

function renderPagination(){
  const totalPages = Math.ceil(filteredParents.length / PAGE_SIZE);
  const pagEl = document.getElementById('pagination');
  if(totalPages <= 1){ pagEl.innerHTML=''; return; }
  let html='';
  for(let i=1;i<=totalPages;i++) html += `<button class="${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
  pagEl.innerHTML = html;
}
function goToPage(p){ currentPage=p; renderTable(); }

/* ============ PARENT PROFILE DRAWER ============ */
function openDrawer(id){
  const p = EliteAcademy.storage.findById(K.parents, id);
  if(!p) return;
  currentDrawerParentId = id;

  const linkedStudents = getLinkedStudents(id);
  const settings = EliteAcademy.utils.getSettings();
  const payments = getData(K.payments);

  let totalExpected = 0, totalPaid = 0;
  linkedStudents.forEach(s => {
    totalExpected += Number(settings.monthlyFee||0) + Number(settings.registrationFee||0);
    totalPaid += payments.filter(pay=>pay.studentId===s.id).reduce((sum,pay)=>sum+Number(pay.amount||0),0);
  });
  const totalRemaining = Math.max(totalExpected - totalPaid, 0);

  document.getElementById('drawerBody').innerHTML = `
    <div class="parent-profile-top">
      <div class="parent-profile-avatar">${initials(p.firstname,p.lastname)}</div>
      <div>
        <div style="font-size:17px;font-weight:800;">${p.firstname} ${p.lastname}</div>
        <div style="font-size:12px;color:var(--text-muted);">${p.relation||'—'} ${p.job ? '— '+p.job : ''}</div>
        <span class="badge ${(p.status||'نشط')==='مؤرشف'?'badge-archived':'badge-accepted'}" style="margin-top:6px;display:inline-block;">${p.status||'نشط'}</span>
      </div>
    </div>

    <div class="info-grid-2" style="margin-bottom:20px;">
      <div class="info-item"><span>الهاتف</span><b class="ltr">${p.phone}</b></div>
      <div class="info-item"><span>هاتف إضافي</span><b class="ltr">${p.phone2||'—'}</b></div>
      <div class="info-item"><span>البريد الإلكتروني</span><b class="ltr">${p.email||'—'}</b></div>
      <div class="info-item"><span>المهنة</span><b>${p.job||'—'}</b></div>
      <div class="info-item" style="grid-column:1/-1;"><span>العنوان</span><b>${p.address||'—'}</b></div>
      ${p.notes ? `<div class="info-item" style="grid-column:1/-1;"><span>ملاحظات</span><b>${p.notes}</b></div>` : ''}
    </div>

    <div style="display:flex;gap:8px;margin-bottom:22px;">
      <button class="btn btn-sm btn-dark" onclick="callPhone('${p.phone}', event)"><i class="fa-solid fa-phone"></i> اتصال</button>
      <button class="btn btn-sm btn-outline" onclick="copyPhone('${p.phone}', event)"><i class="fa-solid fa-copy"></i> نسخ الرقم</button>
      <button class="btn btn-sm btn-outline" onclick="openEditParentModal('${p.id}')"><i class="fa-solid fa-pen"></i> تعديل البيانات</button>
    </div>

    ${linkedStudents.length > 1 ? `
    <h4 style="font-size:13.5px;margin-bottom:10px;">الملخص المالي الإجمالي (${linkedStudents.length} طلبة)</h4>
    <div class="parent-fin-grid">
      <div class="pfin-box"><span>المتوقع</span><b>${EliteAcademy.utils.formatCurrency(totalExpected)}</b></div>
      <div class="pfin-box paid"><span>المدفوع</span><b>${EliteAcademy.utils.formatCurrency(totalPaid)}</b></div>
      <div class="pfin-box remaining"><span>المتبقي</span><b>${EliteAcademy.utils.formatCurrency(totalRemaining)}</b></div>
    </div>` : ''}

    <h4 style="font-size:13.5px;margin-bottom:10px;">الطلبة المرتبطون (${linkedStudents.length})</h4>
    <div>
      ${linkedStudents.length ? linkedStudents.map(s => `
        <div class="linked-student-card" onclick="window.location.href='student-profile.html?id=${s.id}'">
          <div class="lsc-avatar">${initials(s.firstname,s.lastname)}</div>
          <div><div class="lsc-name">${s.firstname} ${s.lastname}</div><div class="lsc-meta">${s.level} — ${s.section} — بطاقة: ${s.cardNumber}</div></div>
          <span class="badge ${EliteAcademy.utils.statusBadgeClass(s.status)}">${s.status}</span>
          <i class="fa-solid fa-chevron-left" style="color:var(--text-muted);margin-right:4px;"></i>
        </div>
      `).join('') : `<div class="empty-state"><i class="fa-solid fa-user-graduate"></i><p>لا يوجد طلبة مرتبطون بهذا الولي بعد</p></div>`}
    </div>
  `;

  document.getElementById('drawerOverlay').classList.add('active');
  document.getElementById('drawerPanel').classList.add('active');
}
function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('active');
  document.getElementById('drawerPanel').classList.remove('active');
}

/* ============ ADD / EDIT PARENT MODAL ============ */
function openAddParentModal(){
  document.getElementById('parentForm').reset();
  document.getElementById('editingParentId').value = '';
  document.getElementById('parentFormTitle').textContent = 'إضافة ولي أمر جديد';
  document.getElementById('parentFormSubmitBtn').textContent = 'حفظ ولي الأمر';
  pendingLinkedStudentIds = [];
  document.getElementById('linkStudentSearch').value = '';
  document.getElementById('linkStudentResults').innerHTML = '';
  clearFormErrors(document.getElementById('parentForm'));
  renderLinkedStudentsPreview();
  document.getElementById('parentFormModal').classList.add('active');
}

function openEditParentModal(id){
  const p = EliteAcademy.storage.findById(K.parents, id);
  if(!p) return;
  const form = document.getElementById('parentForm');
  form.reset();
  clearFormErrors(form);

  document.getElementById('editingParentId').value = id;
  document.getElementById('parentFormTitle').textContent = `تعديل بيانات: ${p.firstname} ${p.lastname}`;
  document.getElementById('parentFormSubmitBtn').textContent = 'حفظ التعديلات';

  form.firstname.value = p.firstname;
  form.lastname.value = p.lastname;
  form.relation.value = p.relation || 'الأب';
  form.job.value = p.job || '';
  form.phone.value = p.phone;
  form.phone2.value = p.phone2 || '';
  form.email.value = p.email || '';
  form.address.value = p.address || '';
  form.notes.value = p.notes || '';

  pendingLinkedStudentIds = getLinkedStudents(id).map(s => s.id);
  document.getElementById('linkStudentSearch').value = '';
  document.getElementById('linkStudentResults').innerHTML = '';
  renderLinkedStudentsPreview();

  document.getElementById('parentFormModal').classList.add('active');
}
function closeParentFormModal(){ document.getElementById('parentFormModal').classList.remove('active'); }
function clearFormErrors(form){ form.querySelectorAll('.form-field[data-field]').forEach(f=>f.classList.remove('has-error')); }

/* ============ LINK STUDENT SEARCH ============ */
document.getElementById('linkStudentSearch').addEventListener('input', function(){
  const q = this.value.trim();
  const box = document.getElementById('linkStudentResults');
  if(!q){ box.innerHTML=''; return; }
  const students = getData(K.students).filter(s =>
    !pendingLinkedStudentIds.includes(s.id) && (s.cardNumber.includes(q) || `${s.firstname} ${s.lastname}`.includes(q))
  ).slice(0,6);
  box.innerHTML = students.length ? students.map(s => `
    <div style="cursor:pointer;padding:6px 8px;border-radius:7px;" onmouseover="this.style.background='var(--surface-soft)'" onmouseout="this.style.background=''" onclick="addLinkedStudent('${s.id}')">
      <i class="fa-solid fa-user-graduate" style="color:var(--accent);"></i> ${s.firstname} ${s.lastname} <span class="ltr" style="color:var(--text-muted);">— ${s.cardNumber}</span>
    </div>`).join('') : `<div style="color:var(--text-muted);padding:6px;">لا توجد نتائج</div>`;
});

function addLinkedStudent(id){
  if(!pendingLinkedStudentIds.includes(id)) pendingLinkedStudentIds.push(id);
  document.getElementById('linkStudentSearch').value = '';
  document.getElementById('linkStudentResults').innerHTML = '';
  renderLinkedStudentsPreview();
}
function removeLinkedStudent(id){
  pendingLinkedStudentIds = pendingLinkedStudentIds.filter(x => x !== id);
  renderLinkedStudentsPreview();
}
function renderLinkedStudentsPreview(){
  const box = document.getElementById('linkedStudentsPreview');
  if(pendingLinkedStudentIds.length === 0){ box.innerHTML = `<p style="font-size:11.5px;color:var(--text-muted);">لا يوجد طلبة مرتبطون حتى الآن</p>`; return; }
  box.innerHTML = pendingLinkedStudentIds.map(id => {
    const s = EliteAcademy.storage.findById(K.students, id);
    if(!s) return '';
    return `<span class="student-chip">${s.firstname} ${s.lastname} <button onclick="removeLinkedStudent('${id}')" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:11px;">✕</button></span>`;
  }).join('');
}

/* ============ SAVE PARENT ============ */
document.getElementById('parentForm').addEventListener('submit', function(e){
  e.preventDefault();
  clearFormErrors(this);
  let valid = true;
  ['firstname','lastname','phone'].forEach(name => {
    const input = this.querySelector(`[name="${name}"]`);
    if(EliteAcademy.utils.isEmpty(input.value)){ input.closest('.form-field').classList.add('has-error'); valid=false; }
  });
  const phoneInput = this.querySelector('[name="phone"]');
  if(!EliteAcademy.utils.validatePhone(phoneInput.value)){ phoneInput.closest('.form-field').classList.add('has-error'); valid=false; }
  if(!valid){ EliteAcademy.notifications.showError('يرجى تصحيح الحقول المظللة'); return; }

  const data = EliteAcademy.utils.serializeForm(this);
  const editingId = document.getElementById('editingParentId').value;
  let parentRecord;

  if(editingId){
    parentRecord = EliteAcademy.storage.updateRecord(K.parents, editingId, {
      firstname:data.firstname, lastname:data.lastname, relation:data.relation, job:data.job||'',
      phone:data.phone, phone2:data.phone2||'', email:data.email||'', address:data.address||'', notes:data.notes||''
    });
    EliteAcademy.utils.logAction('update','parents', editingId, `تم تعديل بيانات ولي الأمر ${data.firstname} ${data.lastname}`, 'info');
  } else {
    const dup = EliteAcademy.utils.findDuplicate(K.parents, 'phone', data.phone);
    if(dup){
      EliteAcademy.notifications.showWarning('يوجد ولي أمر مسجل بنفس رقم الهاتف بالفعل — تم استخدام السجل الموجود بدل إنشاء سجل مكرر');
      parentRecord = dup;
    } else {
      parentRecord = EliteAcademy.storage.saveRecord(K.parents, {
        firstname:data.firstname, lastname:data.lastname, relation:data.relation, job:data.job||'',
        phone:data.phone, phone2:data.phone2||'', email:data.email||'', address:data.address||'', notes:data.notes||'',
        status:'نشط', isDemo:false
      });
      EliteAcademy.utils.logAction('create','parents', parentRecord.id, `تمت إضافة ولي أمر جديد: ${data.firstname} ${data.lastname}`, 'success');
    }
  }

  // Sync linked students -> update their parentId/parentName/parentPhone
  const previouslyLinked = getLinkedStudents(parentRecord.id).map(s=>s.id);
  const toLink = pendingLinkedStudentIds.filter(id => !previouslyLinked.includes(id));
  const toUnlink = previouslyLinked.filter(id => !pendingLinkedStudentIds.includes(id));

  toLink.forEach(id => {
    EliteAcademy.storage.updateRecord(K.students, id, { parentId:parentRecord.id, parentName:`${parentRecord.firstname} ${parentRecord.lastname}`, parentPhone:parentRecord.phone });
  });
  toUnlink.forEach(id => {
    EliteAcademy.storage.updateRecord(K.students, id, { parentId:'', parentName:'—', parentPhone:'' });
  });
  if(toLink.length || toUnlink.length){
    EliteAcademy.utils.logAction('update','parents', parentRecord.id, `تم تحديث ربط الطلبة بولي الأمر ${parentRecord.firstname} ${parentRecord.lastname}`, 'info');
  }

  EliteAcademy.notifications.showSuccess(editingId ? 'تم حفظ التعديلات بنجاح' : 'تمت إضافة ولي الأمر بنجاح');
  closeParentFormModal();
  refreshAll();
});

/* ============ EXPORT ============ */
function exportParents(){
  const blob = new Blob([JSON.stringify(getData(K.parents), null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'parents.json'; a.click();
  URL.revokeObjectURL(url);
  EliteAcademy.notifications.showSuccess('تم تصدير بيانات أولياء الأمور بنجاح');
}

/* ============ REFRESH ============ */
function refreshAll(){
  renderStats();
  filteredParents = getFilteredList();
  renderTable();
}

/* ============ INIT ============ */
initDropdowns();
refreshAll();
</script>
