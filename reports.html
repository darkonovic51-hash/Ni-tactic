<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير والإحصائيات | أكاديمية النخبة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
.page-actions-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
.page-actions-btns{display:flex;gap:8px;flex-wrap:wrap;}

.categories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px;}
.category-card{background:var(--surface);border-radius:var(--radius-md);padding:20px 16px;box-shadow:var(--shadow-sm);border:1px solid var(--border);border-top:4px solid var(--accent);cursor:pointer;transition:.2s;text-align:center;}
.category-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);}
.category-card.active-cat{border-color:var(--primary);background:var(--surface-soft);}
.category-card i{font-size:24px;color:var(--primary);margin-bottom:10px;}
.category-card h4{font-size:13px;font-weight:800;}

.builder-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;margin-bottom:20px;}
.builder-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px;}
.builder-grid select, .builder-grid input{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'Cairo',sans-serif;font-size:12.5px;background:var(--surface-soft);width:100%;}
.builder-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
@media(max-width:900px){ .builder-grid{grid-template-columns:1fr 1fr;} }

.report-preview{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:26px;}
.report-preview-head{text-align:center;margin-bottom:20px;padding-bottom:18px;border-bottom:2px solid var(--surface-soft);}
.report-preview-head .logo-icon{margin:0 auto 10px;}
.report-preview-head h2{font-size:18px;margin-bottom:4px;}
.report-preview-head p{font-size:11.5px;color:var(--text-muted);}
.report-filters-used{font-size:11px;color:var(--text-muted);background:var(--surface-soft);border-radius:8px;padding:8px 12px;margin-top:10px;display:inline-block;}

.kpi-cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
.report-kpi{background:var(--surface-soft);border-radius:var(--radius-md);padding:14px;text-align:center;}
.report-kpi b{display:block;font-size:19px;font-weight:800;color:var(--primary);}
.report-kpi span{font-size:10.5px;color:var(--text-muted);font-weight:600;}

.bar-chart-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.bar-chart-label{width:130px;font-size:12px;font-weight:700;flex-shrink:0;}
.bar-chart-track{flex:1;height:11px;background:var(--surface-soft);border-radius:8px;overflow:hidden;}
.bar-chart-fill{height:100%;border-radius:8px;}
.bar-chart-value{width:50px;text-align:left;font-size:11.5px;font-weight:800;color:var(--text-muted);flex-shrink:0;}

.donut-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;}
.donut-legend-item{display:flex;align-items:center;gap:7px;font-size:12px;}
.donut-legend-dot{width:11px;height:11px;border-radius:50%;}

.report-footer-note{text-align:center;font-size:11px;color:var(--text-muted);margin-top:24px;padding-top:14px;border-top:1px dashed var(--border);}

@media print{
  .categories-grid,.builder-panel,.page-actions-row,.breadcrumb{display:none !important;}
}
</style>
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-panel">
    <div class="topbar">
      <div class="topbar-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="topSearchInput" placeholder="بحث شامل..."></div>
      <div class="topbar-right">
        <div class="topbar-notif"><i class="fa-solid fa-bell"></i><span class="dot"></span></div>
        <div class="topbar-admin"><div class="topbar-admin-avatar">AD</div><div><span>المدير</span><small>admin</small></div></div>
      </div>
    </div>

    <div class="dash-content">
      <div class="breadcrumb"><a href="dashboard.html">الرئيسية</a><i class="fa-solid fa-chevron-left"></i><span>التقارير والإحصائيات</span></div>

      <div class="page-actions-row">
        <div>
          <span class="demo-tag"><i class="fa-solid fa-flask"></i> بيانات تجريبية — Demo Data</span>
          <h2 style="font-size:22px;font-weight:800;">التقارير والإحصائيات</h2>
          <p style="font-size:13px;color:var(--text-muted);">تقارير إدارية ومالية وإحصائيات شاملة للأكاديمية</p>
        </div>
        <div class="page-actions-btns">
          <button class="btn btn-outline btn-sm" onclick="exportCurrentReport('csv')"><i class="fa-solid fa-file-csv"></i> تصدير CSV</button>
          <button class="btn btn-outline btn-sm" onclick="exportCurrentReport('json')"><i class="fa-solid fa-file-code"></i> تصدير JSON</button>
          <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
      </div>

      <!-- CATEGORIES -->
      <div class="categories-grid" id="categoriesGrid"></div>

      <!-- BUILDER -->
      <div class="builder-panel" id="builderPanel" style="display:none;">
        <div class="builder-grid" id="builderGrid"></div>
        <div class="builder-actions">
          <button class="btn btn-ghost btn-sm" onclick="resetBuilder()"><i class="fa-solid fa-rotate-left"></i> إعادة ضبط</button>
          <button class="btn btn-outline btn-sm" onclick="generateReport(true)"><i class="fa-solid fa-eye"></i> معاينة التقرير</button>
          <button class="btn btn-dark btn-sm" onclick="generateReport(false)"><i class="fa-solid fa-file-lines"></i> إنشاء التقرير</button>
        </div>
      </div>

      <!-- PREVIEW -->
      <div class="report-preview printable-area" id="reportPreview">
        <div class="empty-state"><i class="fa-solid fa-chart-simple"></i><p>اختر فئة تقرير من الأعلى لبدء إنشاء تقرير</p></div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase (optional realtime sync layer — must load BEFORE shared.js) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="shared.js"></script>
<script>
EliteAcademy.auth.requireAuth();
EliteAcademy.navigation.renderSidebar('reports');

const K = EliteAcademy.storage.keys;
const getData = EliteAcademy.storage.getData;

let currentCategory = null;
let lastReportData = null; // { title, rows: [...], filename }

const CATEGORIES = [
  { key:'students', label:'تقارير الطلبة', icon:'fa-user-graduate' },
  { key:'registration', label:'تقارير التسجيل', icon:'fa-file-lines' },
  { key:'attendance', label:'تقارير الحضور', icon:'fa-calendar-check' },
  { key:'finance', label:'تقارير المالية', icon:'fa-sack-dollar' },
  { key:'classes', label:'تقارير الأقسام', icon:'fa-door-open' },
  { key:'teachers', label:'تقارير الأساتذة', icon:'fa-chalkboard-user' },
  { key:'staff', label:'تقارير الموظفين', icon:'fa-id-badge' },
  { key:'documents', label:'تقارير الوثائق', icon:'fa-folder-open' },
  { key:'activity', label:'تقارير النشاط الإداري', icon:'fa-clock-rotate-left' }
];

/* ============ CATEGORIES GRID ============ */
function renderCategories(){
  document.getElementById('categoriesGrid').innerHTML = CATEGORIES.map(c => `
    <div class="category-card ${currentCategory===c.key?'active-cat':''}" onclick="selectCategory('${c.key}')">
      <i class="fa-solid ${c.icon}"></i><h4>${c.label}</h4>
    </div>
  `).join('');
}

function selectCategory(key){
  currentCategory = key;
  renderCategories();
  renderBuilder(key);
  document.getElementById('builderPanel').style.display = 'block';
  document.getElementById('reportPreview').innerHTML = `<div class="empty-state"><i class="fa-solid fa-sliders"></i><p>اضبط الفلاتر ثم اضغط "معاينة التقرير" أو "إنشاء التقرير"</p></div>`;
}

/* ============ BUILDER FIELDS PER CATEGORY ============ */
function renderBuilder(key){
  const years = getData(K.academicYears);
  const levels = getData(K.levels);
  let html = '';

  const yearOpt = `<select id="b_year"><option value="">السنة الدراسية (الكل)</option>${years.map(y=>`<option value="${y.id}">${y.label}</option>`).join('')}</select>`;
  const levelOpt = `<select id="b_level"><option value="">المستوى (الكل)</option>${levels.map(l=>`<option value="${l.name}">${l.name}</option>`).join('')}</select>`;
  const dateFrom = `<input type="date" id="b_dateFrom" title="من تاريخ">`;
  const dateTo = `<input type="date" id="b_dateTo" title="إلى تاريخ">`;

  if(key==='students'){
    html = yearOpt + levelOpt +
      `<select id="b_gender"><option value="">الجنس (الكل)</option><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select>` +
      `<select id="b_status"><option value="">الحالة (الكل)</option><option value="نشط">نشط</option><option value="مؤرشف">مؤرشف</option></select>` +
      dateFrom;
  }
  if(key==='registration'){
    html = `<select id="b_status"><option value="">الحالة (الكل)</option><option>جديد</option><option>قيد الدراسة</option><option>تم التواصل</option><option>مقبول</option><option>مرفوض</option><option>مكتمل التسجيل</option></select>` + dateFrom + dateTo;
  }
  if(key==='attendance'){
    html = levelOpt + `<select id="b_section"><option value="">القسم (الكل)</option>${getData(K.classes).map(c=>`<option value="${c.name}">${c.name}</option>`).join('')}</select>` + dateFrom + dateTo;
  }
  if(key==='finance'){
    html = `<select id="b_payType"><option value="">نوع الدفعة (الكل)</option><option>رسوم التسجيل</option><option>القسط الشهري</option><option>قسط إضافي</option><option>مبلغ آخر</option></select>` +
      `<select id="b_method"><option value="">طريقة الدفع (الكل)</option><option>نقداً</option><option>تحويل</option><option>أخرى</option></select>` + dateFrom + dateTo;
  }
  if(key==='classes'){ html = levelOpt; }
  if(key==='teachers'){ html = `<select id="b_status"><option value="">الحالة (الكل)</option><option value="نشط">نشط</option><option value="غير نشط">غير نشط</option></select>`; }
  if(key==='staff'){ html = `<select id="b_status"><option value="">الحالة (الكل)</option><option value="نشط">نشط</option><option value="غير نشط">غير نشط</option><option value="في إجازة">في إجازة</option></select>`; }
  if(key==='documents'){ html = `<select id="b_status"><option value="">الحالة (الكل)</option><option>ساري</option><option>منتهي</option><option>قريب الانتهاء</option><option>قيد المراجعة</option></select>`; }
  if(key==='activity'){ html = dateFrom + dateTo; }

  document.getElementById('builderGrid').innerHTML = html;
}

function resetBuilder(){ if(currentCategory) renderBuilder(currentCategory); }

/* ============ HELPERS ============ */
function bv(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function colorBar(i){ const palette=['var(--primary)','var(--accent)','var(--success)','var(--info)','var(--warning)','var(--danger)','var(--secondary)']; return palette[i % palette.length]; }

function renderBarList(items){
  const max = Math.max(...items.map(i=>i.value), 1);
  return items.map((i,idx) => `
    <div class="bar-chart-row">
      <div class="bar-chart-label">${i.label}</div>
      <div class="bar-chart-track"><div class="bar-chart-fill" style="width:${Math.round((i.value/max)*100)}%;background:${colorBar(idx)};"></div></div>
      <div class="bar-chart-value">${i.value}</div>
    </div>
  `).join('');
}

function renderTable(headers, rows){
  if(rows.length === 0) return `<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>لا توجد بيانات مطابقة لهذا التقرير</p></div>`;
  return `<div style="overflow-x:auto;"><table class="dtable">
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((cell,i)=>`<td data-label="${headers[i]}">${cell}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function reportHeader(title, filtersDesc){
  const settings = EliteAcademy.utils.getSettings();
  return `
    <div class="report-preview-head">
      <div class="logo-icon" style="margin:0 auto 10px;"><i class="fa-solid fa-graduation-cap"></i></div>
      <h2>${settings.institutionName}</h2>
      <p>${title}</p>
      <p>تاريخ الإنشاء: ${new Date().toLocaleDateString('ar-DZ')} — ${new Date().toLocaleTimeString('ar-DZ',{hour:'2-digit',minute:'2-digit'})}</p>
      ${filtersDesc ? `<div class="report-filters-used"><i class="fa-solid fa-filter"></i> ${filtersDesc}</div>` : ''}
    </div>
  `;
}
function reportFooter(){
  const session = EliteAcademy.auth.getSession();
  return `<div class="report-footer-note">تم إنشاء هذا التقرير بواسطة: ${(session&&session.username)||'المدير'} — نظام إدارة أكاديمية النخبة</div>`;
}

/* ============ REPORT GENERATORS ============ */
function generateReport(previewOnly){
  if(!currentCategory) return;
  const generators = {
    students: reportStudents, registration: reportRegistration, attendance: reportAttendance,
    finance: reportFinance, classes: reportClasses, teachers: reportTeachers,
    staff: reportStaff, documents: reportDocuments, activity: reportActivity
  };
  generators[currentCategory]();
  if(!previewOnly){
    EliteAcademy.utils.logAction('create','reports','', `تم إنشاء تقرير: ${CATEGORIES.find(c=>c.key===currentCategory).label}`, 'info');
    EliteAcademy.notifications.showSuccess('تم إنشاء التقرير بنجاح');
  }
}

/* ----- STUDENTS ----- */
function reportStudents(){
  const yearId=bv('b_year'), level=bv('b_level'), gender=bv('b_gender'), status=bv('b_status'), dateFrom=bv('b_dateFrom');
  let students = getData(K.students);
  if(yearId) students = students.filter(s=>s.academicYearId===yearId);
  if(level) students = students.filter(s=>s.level===level);
  if(gender) students = students.filter(s=>s.gender===gender);
  if(status) students = students.filter(s=>s.status===status);
  if(dateFrom) students = students.filter(s=>s.registeredAt>=dateFrom);

  const active = students.filter(s=>s.status==='نشط').length;
  const archived = students.filter(s=>s.status==='مؤرشف').length;
  const males = students.filter(s=>s.gender==='ذكر').length;
  const females = students.filter(s=>s.gender==='أنثى').length;
  const thisMonth = new Date().toISOString().slice(0,7);
  const newThisMonth = students.filter(s=>s.registeredAt && s.registeredAt.startsWith(thisMonth)).length;

  const levels = getData(K.levels);
  const byLevel = levels.map(l=>({label:l.name, value:students.filter(s=>s.level===l.name).length})).filter(x=>x.value>0);
  const sections = getData(K.classes);
  const bySection = sections.map(c=>({label:c.name, value:students.filter(s=>s.section===c.name).length})).filter(x=>x.value>0);

  const filtersDesc = [level&&`المستوى: ${level}`, gender&&`الجنس: ${gender}`, status&&`الحالة: ${status}`].filter(Boolean).join(' — ') || 'بدون فلاتر';

  document.getElementById('reportPreview').innerHTML = `
    ${reportHeader('تقرير الطلبة', filtersDesc)}
    <div class="kpi-cards-row">
      <div class="report-kpi"><b>${students.length}</b><span>إجمالي الطلبة</span></div>
      <div class="report-kpi"><b>${active}</b><span>نشطون</span></div>
      <div class="report-kpi"><b>${archived}</b><span>مؤرشفون</span></div>
      <div class="report-kpi"><b>${males}</b><span>ذكور</span></div>
      <div class="report-kpi"><b>${females}</b><span>إناث</span></div>
      <div class="report-kpi"><b>${newThisMonth}</b><span>جدد هذا الشهر</span></div>
    </div>
    <h4 style="margin-bottom:10px;font-size:13.5px;">توزيع الطلبة حسب المستوى</h4>
    ${byLevel.length ? renderBarList(byLevel) : '<p style="color:var(--text-muted);font-size:12px;">لا توجد بيانات</p>'}
    <h4 style="margin:20px 0 10px;font-size:13.5px;">توزيع الطلبة حسب القسم</h4>
    ${bySection.length ? renderBarList(bySection) : '<p style="color:var(--text-muted);font-size:12px;">لا توجد بيانات</p>'}
    <h4 style="margin:20px 0 10px;font-size:13.5px;">قائمة الطلبة (${students.length})</h4>
    ${renderTable(['الاسم','رقم البطاقة','المستوى','القسم','الحالة'], students.map(s=>[`${s.firstname} ${s.lastname}`, s.cardNumber, s.level, s.section, s.status]))}
    ${reportFooter()}
  `;
  lastReportData = { title:'students-report', headers:['الاسم','رقم البطاقة','المستوى','القسم','الحالة'], rows: students.map(s=>[`${s.firstname} ${s.lastname}`, s.cardNumber, s.level, s.section, s.status]) };
}

/* ----- REGISTRATION ----- */
function reportRegistration(){
  const status=bv('b_status'), dateFrom=bv('b_dateFrom'), dateTo=bv('b_dateTo');
  let requests = getData(K.requests);
  if(status) requests = requests.filter(r=>r.status===status);
  if(dateFrom) requests = requests.filter(r=>r.createdAt>=dateFrom);
  if(dateTo) requests = requests.filter(r=>r.createdAt<=dateTo);

  const counts = {};
  ['جديد','قيد الدراسة','تم التواصل','مقبول','مرفوض','مكتمل التسجيل'].forEach(s=>counts[s]=requests.filter(r=>r.status===s).length);
  const total = requests.length;
  const converted = counts['مكتمل التسجيل'];
  const rejected = counts['مرفوض'];
  const conversionRate = total ? Math.round((converted/total)*100) : 0;

  document.getElementById('reportPreview').innerHTML = `
    ${reportHeader('تقرير طلبات التسجيل', status?`الحالة: ${status}`:'بدون فلاتر')}
    <div class="kpi-cards-row">
      <div class="report-kpi"><b>${total}</b><span>إجمالي الطلبات</span></div>
      <div class="report-kpi"><b>${counts['جديد']}</b><span>جديدة</span></div>
      <div class="report-kpi"><b>${counts['قيد الدراسة']}</b><span>قيد الدراسة</span></div>
      <div class="report-kpi"><b>${counts['تم التواصل']}</b><span>تم التواصل</span></div>
      <div class="report-kpi"><b>${counts['مقبول']}</b><span>مقبولة</span></div>
      <div class="report-kpi"><b>${rejected}</b><span>مرفوضة</span></div>
      <div class="report-kpi"><b>${converted}</b><span>مكتملة (محوّلة لطالب)</span></div>
      <div class="report-kpi"><b>${conversionRate}%</b><span>نسبة التحويل</span></div>
    </div>
    <h4 style="margin-bottom:10px;font-size:13.5px;">تفصيل الطلبات</h4>
    ${renderTable(['رقم الطلب','التلميذ','المستوى','الولي','الهاتف','التاريخ','الحالة'], requests.map(r=>[r.regNumber,`${r.student.firstname} ${r.student.lastname}`,r.student.level,`${r.parent.firstname} ${r.parent.lastname}`,r.parent.phone,EliteAcademy.utils.formatDate(r.createdAt),r.status]))}
    ${reportFooter()}
  `;
  lastReportData = { title:'registration-report', headers:['رقم الطلب','التلميذ','المستوى','الولي','الهاتف','التاريخ','الحالة'], rows: requests.map(r=>[r.regNumber,`${r.student.firstname} ${r.student.lastname}`,r.student.level,`${r.parent.firstname} ${r.parent.lastname}`,r.parent.phone,r.createdAt,r.status]) };
}

/* ----- ATTENDANCE ----- */
function reportAttendance(){
  const level=bv('b_level'), section=bv('b_section'), dateFrom=bv('b_dateFrom'), dateTo=bv('b_dateTo');
  let records = getData(K.attendance);
  if(section) records = records.filter(a=>a.classId===section || a.section===section);
  if(dateFrom) records = records.filter(a=>a.date>=dateFrom);
  if(dateTo) records = records.filter(a=>a.date<=dateTo);

  const present = records.filter(r=>r.status==='حاضر').length;
  const absent = records.filter(r=>r.status==='غائب').length;
  const late = records.filter(r=>r.status==='متأخر').length;
  const excused = records.filter(r=>r.status==='غياب مبرر').length;
  const total = records.length || 1;
  const pct = Math.round((present/total)*100);

  const byStudent = {};
  records.filter(r=>r.status==='غائب').forEach(r => byStudent[r.studentName] = (byStudent[r.studentName]||0)+1);
  const topAbsentees = Object.entries(byStudent).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([label,value])=>({label,value}));

  document.getElementById('reportPreview').innerHTML = `
    ${reportHeader('تقرير الحضور والغياب', [level&&`المستوى: ${level}`, section&&`القسم: ${section}`].filter(Boolean).join(' — ') || 'بدون فلاتر')}
    <div class="kpi-cards-row">
      <div class="report-kpi"><b>${records.length}</b><span>إجمالي السجلات</span></div>
      <div class="report-kpi"><b style="color:var(--success);">${present}</b><span>حاضر</span></div>
      <div class="report-kpi"><b style="color:var(--danger);">${absent}</b><span>غائب</span></div>
      <div class="report-kpi"><b style="color:#a3781f;">${late}</b><span>متأخر</span></div>
      <div class="report-kpi"><b>${excused}</b><span>معذور</span></div>

/* ----- FINANCE ----- */
function reportFinance(){
  const payType=bv('b_payType'), method=bv('b_method'), dateFrom=bv('b_dateFrom'), dateTo=bv('b_dateTo');
  let payments = getData(K.payments).filter(p=>p.status!=='ملغى');
  if(payType) payments = payments.filter(p=>(p.type||p.reason)===payType);
  if(method) payments = payments.filter(p=>p.method===method);
  if(dateFrom) payments = payments.filter(p=>p.date>=dateFrom);
  if(dateTo) payments = payments.filter(p=>p.date<=dateTo);

  const expenses = getData(K.expenses).filter(e=>e.status!=='ملغى');
  const totalRevenue = payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalExpenses = expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const net = totalRevenue - totalExpenses;

  const settings = EliteAcademy.utils.getSettings();
  const students = getData(K.students).filter(s=>s.status!=='مؤرشف');
  const debtors = students.filter(s => {
    const paid = getData(K.payments).filter(p=>p.studentId===s.id && p.status!=='ملغى').reduce((sum,p)=>sum+Number(p.amount||0),0);
    const expected = Number(settings.registrationFee||0)+Number(settings.monthlyFee||0)-Number(s.discount||0);
    return paid < expected;
  });
  const partial = debtors.filter(s => getData(K.payments).some(p=>p.studentId===s.id));
  const unpaid = debtors.filter(s => !getData(K.payments).some(p=>p.studentId===s.id));

  document.getElementById('reportPreview').innerHTML = `
    ${reportHeader('التقرير المالي', [payType&&`النوع: ${payType}`, method&&`الطريقة: ${method}`].filter(Boolean).join(' — ') || 'بدون فلاتر')}
    <div class="kpi-cards-row">
      <div class="report-kpi"><b>${EliteAcademy.utils.formatCurrency(totalRevenue)}</b><span>إجمالي الإيرادات</span></div>
      <div class="report-kpi"><b>${EliteAcademy.utils.formatCurrency(totalExpenses)}</b><span>إجمالي المصاريف</span></div>
      <div class="report-kpi"><b>${EliteAcademy.utils.formatCurrency(net)}</b><span>صافي الإيرادات</span></div>
      <div class="report-kpi"><b>${debtors.length}</b><span>طلبة مدينون</span></div>
      <div class="report-kpi"><b>${partial.length}</b><span>دفع جزئي</span></div>
      <div class="report-kpi"><b>${unpaid.length}</b><span>لم يدفعوا بعد</span></div>
    </div>
    <h4 style="margin-bottom:10px;font-size:13.5px;">تفصيل المدفوعات (${payments.length})</h4>
    ${renderTable(['رقم الوصل','الطالب','النوع','المبلغ','الطريقة','التاريخ'], payments.map(p=>[p.receiptNumber,p.studentName,p.type||p.reason,EliteAcademy.utils.formatCurrency(p.amount),p.method,p.date]))}
    ${reportFooter()}
  `;
  lastReportData = { title:'finance-report', headers:['رقم الوصل','الطالب','النوع','المبلغ','الطريقة','التاريخ'], rows: payments.map(p=>[p.receiptNumber,p.studentName,p.type||p.reason,p.amount,p.method,p.date]) };
}

/* ----- CLASSES ----- */
function reportClasses(){
  const level=bv('b_level');
  let classes = getData(K.classes);
  const levels = getData(K.levels);
  if(level){ const lvl = levels.find(l=>l.name===level); classes = classes.filter(c=>c.levelId===lvl?.id); }
  const students = getData(K.students).filter(s=>s.status!=='مؤرشف');
  const attendance = getData(K.attendance);

  const rows = classes.map(c => {
    const lvl = levels.find(l=>l.id===c.levelId);
    const capacity = Number(c.capacity||c.seats||30);
    const occupied = students.filter(s=>s.section===c.name).length;
    const available = Math.max(capacity-occupied,0);
    return [c.name, lvl?lvl.name:'—', capacity, occupied, available];
  });

  document.getElementById('reportPreview').innerHTML = `
    ${reportHeader('تقرير الأقسام', level?`المستوى: ${level}`:'بدون فلاتر')}
    <div class="kpi-cards-row">
      <div class="report-kpi"><b>${classes.length}</b><span>عدد الأقسام</span></div>
      <div class="report-kpi"><b>${rows.reduce((s,r)=>s+r[2],0)}</b><span>إجمالي السعة</span></div>
      <div class="report-kpi"><b>${rows.reduce((s,r)=>s+r[3],0)}</b><span>المقاعد المشغولة</span></div>
      <div class="report-kpi"><b>${rows.reduce((s,r)=>s+r[4],0)}</b><span>المقاعد المتاحة</span></div>
    </div>
    ${renderTable(['القسم','المستوى','السعة','الطلبة الحاليون','المقاعد المتاحة'], rows)}
    ${reportFooter()}
  `;
  lastReportData = { title:'classes-report', headers:['القسم','المستوى','السعة','الطلبة الحاليون','المقاعد المتاحة'], rows };
}

/* ----- DOCUMENTS ----- */
function reportDocuments(){
  const status=bv('b_status');
  let docs = getData(K.documents).filter(d=>d.status!=='مؤرشف');

  function computeStatus(d){
    if(!d.expiryDate) return d.status||'ساري';
    const daysLeft = Math.ceil((new Date(d.expiryDate)-new Date())/(1000*60*60*24));
    if(daysLeft<0) return 'منتهي';
    if(daysLeft<=30) return 'قريب الانتهاء';
    return d.status||'ساري';
  }
  const withStatus = docs.map(d=>({...d, computedStatus:computeStatus(d)}));
  const filtered = status ? withStatus.filter(d=>d.computedStatus===status) : withStatus;

  const byEntity = { student:0, teacher:0, staff:0, parent:0, institution:0, request:0 };
  withStatus.forEach(d => { if(byEntity[d.entityType]!==undefined) byEntity[d.entityType]++; });
  const expired = withStatus.filter(d=>d.computedStatus==='منتهي').length;
  const expiringSoon = withStatus.filter(d=>d.computedStatus==='قريب الانتهاء').length;
  const needsReview = withStatus.filter(d=>d.computedStatus==='قيد المراجعة'||d.computedStatus==='مفقود').length;

  document.getElementById('reportPreview').innerHTML = `
    ${reportHeader('تقرير الوثائق', status?`الحالة: ${status}`:'بدون فلاتر')}
    <div class="kpi-cards-row">
      <div class="report-kpi"><b>${withStatus.length}</b><span>إجمالي الوثائق</span></div>
      <div class="report-kpi"><b>${byEntity.student}</b><span>وثائق طلبة</span></div>
      <div class="report-kpi"><b>${byEntity.teacher}</b><span>وثائق أساتذة</span></div>
      <div class="report-kpi"><b>${byEntity.staff}</b><span>وثائق موظفين</span></div>
      <div class="report-kpi"><b>${expired}</b><span>منتهية</span></div>
      <div class="report-kpi"><b>${expiringSoon}</b><span>قريبة الانتهاء</span></div>
      <div class="report-kpi"><b>${needsReview}</b><span>تحتاج مراجعة</span></div>
    </div>
    ${renderTable(['العنوان','رقم الوثيقة','النوع','الحالة'], filtered.map(d=>[d.title,d.documentNumber,d.type,d.computedStatus]))}
    ${reportFooter()}
  `;
  lastReportData = { title:'documents-report', headers:['العنوان','رقم الوثيقة','النوع','الحالة'], rows: filtered.map(d=>[d.title,d.documentNumber,d.type,d.computedStatus]) };
}

/* ----- ADMINISTRATIVE ACTIVITY ----- */
function reportActivity(){
  const dateFrom=bv('b_dateFrom'), dateTo=bv('b_dateTo');
  let logs = getData(K.logs);
  // logs store localized date strings; also allow raw timestamp filtering when available
  if(dateFrom || dateTo){
    logs = logs.filter(l => {
      if(!l.timestamp) return true;
      const d = l.timestamp.split('T')[0];
      if(dateFrom && d<dateFrom) return false;
      if(dateTo && d>dateTo) return false;
      return true;
    });
  }

  const byAction = {};
  logs.forEach(l => byAction[l.action] = (byAction[l.action]||0)+1);
  const actionLabels = { create:'إنشاء', update:'تعديل', archive:'أرشفة', restore:'استعادة', login:'دخول', logout:'خروج', convert:'تحويل' };
  const actionRows = Object.entries(byAction).map(([k,v])=>({label:actionLabels[k]||k, value:v}));

  document.getElementById('reportPreview').innerHTML = `
    ${reportHeader('تقرير النشاط الإداري', [dateFrom&&`من: ${dateFrom}`, dateTo&&`إلى: ${dateTo}`].filter(Boolean).join(' — ') || 'كل الفترات')}
    <div class="kpi-cards-row">
      <div class="report-kpi"><b>${logs.length}</b><span>إجمالي العمليات</span></div>
      <div class="report-kpi"><b>${byAction.create||0}</b><span>إنشاء</span></div>
      <div class="report-kpi"><b>${byAction.update||0}</b><span>تعديل</span></div>
      <div class="report-kpi"><b>${byAction.archive||0}</b><span>أرشفة</span></div>
      <div class="report-kpi"><b>${byAction.convert||0}</b><span>تحويل طلبات</span></div>
    </div>
    <h4 style="margin-bottom:10px;font-size:13.5px;">توزيع العمليات حسب النوع</h4>
    ${actionRows.length ? renderBarList(actionRows) : '<p style="color:var(--text-muted);font-size:12px;">لا توجد بيانات</p>'}
    <h4 style="margin:20px 0 10px;font-size:13.5px;">آخر العمليات (${Math.min(logs.length,100)})</h4>
    ${renderTable(['الوصف','بواسطة','التاريخ','الساعة'], logs.slice(0,100).map(l=>[l.description,l.user||'admin',l.date,l.time]))}
    ${reportFooter()}
  `;
  lastReportData = { title:'activity-report', headers:['الوصف','بواسطة','التاريخ','الساعة'], rows: logs.map(l=>[l.description,l.user||'admin',l.date,l.time]) };
}

/* ============ EXPORT (CSV / JSON) ============ */
function exportCurrentReport(format){
  if(!lastReportData){ EliteAcademy.notifications.showWarning('يرجى إنشاء تقرير أولًا قبل التصدير'); return; }

  if(format === 'json'){
    const blob = new Blob([JSON.stringify(lastReportData, null, 2)], { type:'application/json' });
    downloadBlob(blob, `${lastReportData.title}.json`);
  } else {
    const csvRows = [lastReportData.headers.join(','), ...lastReportData.rows.map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(','))];
    const blob = new Blob(['\uFEFF'+csvRows.join('\n')], { type:'text/csv;charset=utf-8;' });
    downloadBlob(blob, `${lastReportData.title}.csv`);
  }
  EliteAcademy.notifications.showSuccess('تم تصدير التقرير بنجاح');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ============ HANDLE INCOMING QUERY PARAMS (from attendance.html / payment.html links) ============ */
function handleIncomingParams(){
  const params = new URLSearchParams(window.location.search);
  const module = params.get('module');
  const type = params.get('type');
  if(module === 'attendance'){ selectCategory('attendance'); if(params.get('section')) setTimeout(()=>{ const el=document.getElementById('b_section'); if(el) el.value=params.get('section'); },0); }
  if(module === 'finance'){ selectCategory('finance'); }
}
