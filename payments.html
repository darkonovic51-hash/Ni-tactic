<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدفوعات والمستحقات | School Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#4F46E5; --primary-dark:#4338CA; --primary-light:#EEF2FF;
    --success:#16A34A; --success-light:#F0FDF4;
    --danger:#DC2626; --danger-light:#FEF2F2;
    --warning:#D97706; --warning-light:#FFFBEB;
    --bg:#F8FAFC; --surface:#FFFFFF; --border:#E2E8F0;
    --text:#0F172A; --text-muted:#64748B;
    --radius:16px; --shadow:0 10px 30px -10px rgba(15,23,42,0.10);
    --shadow-sm:0 2px 8px rgba(15,23,42,0.06); --sidebar-w:260px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Cairo', sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; }
  .app-shell{ display:flex; min-height:100vh; }
  .sidebar{ width:var(--sidebar-w); background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; position:fixed; top:0; right:0; bottom:0; z-index:100; transition:transform .25s ease; }
  .sidebar-brand{ display:flex; align-items:center; gap:12px; padding:22px 20px; border-bottom:1px solid var(--border); }
  .sidebar-brand .logo-circle{ width:42px; height:42px; border-radius:12px; background:var(--primary-light); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; }
  .sidebar-brand .logo-circle img{ width:100%; height:100%; object-fit:cover; }
  .sidebar-brand h2{ font-size:15px; font-weight:800; }
  .sidebar-brand span{ font-size:12px; color:var(--text-muted); }
  .sidebar-nav{ flex:1; overflow-y:auto; padding:14px 12px; }
  .nav-item{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:11px; font-size:14.5px; font-weight:600; color:var(--text-muted); margin-bottom:2px; cursor:pointer; }
  .nav-item:hover{ background:var(--bg); color:var(--text); }
  .nav-item.active{ background:var(--primary-light); color:var(--primary-dark); }
  .nav-item .icon{ font-size:17px; width:20px; text-align:center; }
  .sidebar-footer{ padding:16px; border-top:1px solid var(--border); }
  .sidebar-footer .inst-name{ font-size:13.5px; font-weight:700; }
  .sidebar-footer .admin-email{ font-size:12px; color:var(--text-muted); margin-bottom:12px; }
  .btn-logout{ width:100%; padding:10px; border:1.5px solid var(--border); background:transparent; border-radius:10px; font-size:13.5px; font-weight:700; color:var(--danger); cursor:pointer; }
  .btn-logout:hover{ background:var(--danger-light); }
  .main{ margin-right:var(--sidebar-w); flex:1; min-width:0; }
  .topbar{ background:var(--surface); border-bottom:1px solid var(--border); padding:16px 28px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:50; }
