<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>محاكاة قيادة الدول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --navy:#0A1628; --navy2:#132540; --gold:#C89A2B; --gold-light:#E4C46A;
    --success:#27AE60; --warning:#F4B400; --error:#E53935; --bg:#0d1420;
    --card:#111d31; --border:rgba(200,154,43,0.18); --text2:#8b96a8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Cairo',sans-serif; background:var(--bg); color:#fff; overflow-x:hidden;}
  #root{min-height:100vh;}
  .btn{border:none; cursor:pointer; font-family:'Cairo',sans-serif; border-radius:14px; font-weight:700; transition:.25s;}
  .btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold)); color:#1a1400; padding:14px 28px;}
  .btn-gold:hover{transform:translateY(-2px); box-shadow:0 12px 30px rgba(200,154,43,0.35);}
  .btn-outline{background:transparent; border:1.5px solid var(--border); color:#fff; padding:12px 22px;}
  .btn-outline:hover{border-color:var(--gold);}
  .card{background:var(--card); border:1px solid var(--border); border-radius:20px; padding:22px;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--gold); border-radius:10px;}
</style>
</head>
<body>
<div id="root"></div>

<!-- ===== React + Babel (بدون أدوات بناء) ===== -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- ===== محرك اللعبة (ملفات JS عادية) ===== -->
<script src="src/engine/countryModel.js"></script>
<script src="src/engine/simulationEngine.js"></script>
<script src="src/engine/aiEventEngine.js"></script>
<script src="src/data/countriesData.js"></script>
<script src="src/storage/saveSystem.js"></script>

<!-- ===== تطبيق React الرئيسي ===== -->
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ============ مكوّن: رسم بياني بسيط بدون مكتبات خارجية ============ */
function MiniLineChart({ data, dataKey, color, label }) {
  if (!data || data.length < 2) {
    return <div style={{color:'var(--text2)', fontSize:'.8rem', textAlign:'center', padding:'20px'}}>لا توجد بيانات كافية بعد</div>;
  }
  const values = data.map(d => d[dataKey]);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const w = 100, h = 40;
  const points = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x},${y}`;
  }).join(' ');

  return (
    <div style={{marginBottom:'6px'}}>
      <div style={{display:'flex', justifyContent:'space-between', fontSize:'.75rem', color:'var(--text2)', marginBottom:'6px'}}>
        <span>{label}</span>
        <span style={{color:color, fontWeight:800}}>{Math.round(values[values.length-1] * 100) / 100}</span>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} style={{width:'100%', height:'60px'}} preserveAspectRatio="none">
        <polyline points={points} fill="none" stroke={color} strokeWidth="1.6" vectorEffect="non-scaling-stroke" />
      </svg>
    </div>
  );
}

/* ============ مكوّن: اختيار الدولة ============ */
function CountrySelector({ onSelect }) {
  return (
    <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'40px 20px'}}>
      <div style={{maxWidth:'1100px', width:'100%'}}>
        <div style={{textAlign:'center', marginBottom:'50px'}}>
          <div style={{color:'var(--gold-light)', fontWeight:800, letterSpacing:'1px', marginBottom:'10px'}}>
            <i className="fas fa-globe"></i> محاكاة قيادة الدول
          </div>
          <h1 style={{fontSize:'2.4rem', fontWeight:900, marginBottom:'14px'}}>اختر الدولة التي ستقودها</h1>
          <p style={{color:'var(--text2)', fontSize:'1rem'}}>كل قرار تتخذه سيُشكّل مستقبل هذه الدولة بشكل حقيقي ومترابط</p>
        </div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))', gap:'22px'}}>
          {window.CountriesData.map(c => (
            <div key={c.id} className="card" style={{textAlign:'center', cursor:'pointer'}}
                 onClick={() => onSelect(c)}
                 onMouseEnter={e => e.currentTarget.style.borderColor='var(--gold)'}
                 onMouseLeave={e => e.currentTarget.style.borderColor='var(--border)'}>
              <div style={{fontSize:'3rem', marginBottom:'12px'}}>{c.flag}</div>
              <h3 style={{fontSize:'1.15rem', fontWeight:800, marginBottom:'8px'}}>{c.name}</h3>
              <div style={{fontSize:'.78rem', color:'var(--text2)'}}>{c.politicalSystem}</div>
              <div style={{fontSize:'.78rem', color:'var(--text2)', marginTop:'4px'}}>
                {(c.population/1e6).toFixed(1)} مليون نسمة
              </div>
              <button className="btn btn-gold" style={{marginTop:'16px', width:'100%', fontSize:'.85rem', padding:'10px'}}>
                ابدأ الحكم <i className="fas fa-arrow-left"></i>
              </button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============ مكوّن: نافذة الحدث والخيارات ============ */
function EventModal({ event, onChoice, loading }) {
  if (!event && !loading) return null;
  const severityColor = { low:'var(--success)', medium:'var(--warning)', high:'#ff8a3d', critical:'var(--error)' };

  return (
    <div style={{position:'fixed', inset:0, background:'rgba(5,10,20,0.8)', backdropFilter:'blur(10px)',
                 zIndex:9999, display:'flex', alignItems:'center', justifyContent:'center', padding:'20px'}}>
      <div className="card" style={{maxWidth:'560px', width:'100%', border:'1px solid var(--gold)'}}>
        {loading ? (
          <div style={{textAlign:'center', padding:'40px 0'}}>
            <i className="fas fa-spinner fa-spin" style={{fontSize:'2rem', color:'var(--gold)'}}></i>
            <p style={{marginTop:'16px', color:'var(--text2)'}}>جاري تحليل الوضع وتوليد الحدث...</p>
          </div>
        ) : (
          <>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px'}}>
              <span style={{background:severityColor[event.severity]+'22', color:severityColor[event.severity],
                            padding:'5px 14px', borderRadius:'20px', fontSize:'.75rem', fontWeight:800}}>
                {event.severity === 'critical' ? 'حرج' : event.severity === 'high' ? 'مرتفع' : event.severity === 'medium' ? 'متوسط' : 'منخفض'}
              </span>
              <span style={{fontSize:'.75rem', color:'var(--text2)'}}>{event.date}</span>
            </div>
            <h3 style={{fontSize:'1.3rem', fontWeight:800, marginBottom:'12px'}}>{event.title}</h3>
            <p style={{color:'var(--text2)', lineHeight:1.9, marginBottom:'22px', fontSize:'.92rem'}}>{event.narrative}</p>
            <div style={{display:'flex', flexDirection:'column', gap:'10px'}}>
              {event.choices.map(choice => (
                <button key={choice.id} className="btn btn-outline" style={{textAlign:'right', padding:'14px 18px'}}
                        onClick={() => onChoice(choice.id)}
                        onMouseEnter={e => e.currentTarget.style.borderColor='var(--gold)'}
                        onMouseLeave={e => e.currentTarget.style.borderColor='var(--border)'}>
                  {choice.label}
                </button>
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ============ المكوّن الرئيسي: لوحة القيادة ============ */
function Dashboard() {
  const [state, setState] = useState(null);
  const [currentEvent, setCurrentEvent] = useState(null);
  const [eventLoading, setEventLoading] = useState(false);
  const [savesList, setSavesList] = useState([]);
  const [showSaves, setShowSaves] = useState(false);
  const [notice, setNotice] = useState(null);

  useEffect(() => {
    window.SaveSystem.listSaves().then(setSavesList);
  }, []);

  const showNotice = (msg) => { setNotice(msg); setTimeout(() => setNotice(null), 3000); };

  const startCountry = (countryData) => {
    const initialState = window.CountryModel.createInitialCountryState(countryData);
    window.SimulationEngine.recalculateDerivedValues(initialState);
    setState(initialState);
  };

  const continueGame = async (slotId) => {
    const loaded = await window.SaveSystem.loadGame(slotId);
    if (loaded) { setState(loaded); showNotice('✅ تم تحميل الحفظ بنجاح'); }
    else showNotice('❌ تعذّر تحميل هذا الحفظ');
    setShowSaves(false);
  };

  const advanceTurn = async () => {
    if (!state) return;
    setEventLoading(true);
    const newState = JSON.parse(JSON.stringify(state));
    const { triggeredEvents } = window.SimulationEngine.runSimulationTurn(newState);
    setState(newState);
    await window.SaveSystem.autoSave(newState);

    if (triggeredEvents.length > 0) {
      const evt = await window.AIEventEngine.generateDynamicEvent(newState, { eventType: triggeredEvents[0].type });
      setCurrentEvent(evt);
    } else if (Math.random() < 0.4) {
      const evt = await window.AIEventEngine.generateDynamicEvent(newState);
      setCurrentEvent(evt);
    }
    setEventLoading(false);
  };

  const handleEventChoice = (choiceId) => {
    const newState = JSON.parse(JSON.stringify(state));
    window.AIEventEngine.applyEventChoice(newState, currentEvent, choiceId, window.SimulationEngine.applyDecision);
    setState(newState);
    setCurrentEvent(null);
    showNotice('✅ تم تنفيذ القرار وتحديث المؤشرات');
  };

  const manualSave = async () => {
    const ok = await window.SaveSystem.saveGame(`slot_${Date.now()}`, state);
    showNotice(ok ? '✅ تم الحفظ بنجاح' : '❌ فشل الحفظ');
    window.SaveSystem.listSaves().then(setSavesList);
  };

  /* ===== شاشة البداية: اختيار دولة أو متابعة حفظ ===== */
  if (!state) {
    return (
      <div>
        {savesList.length > 0 && (
          <div style={{textAlign:'center', paddingTop:'30px'}}>
            <button className="btn btn-outline" onClick={() => setShowSaves(!showSaves)}>
              <i className="fas fa-folder-open"></i> متابعة لعبة محفوظة ({savesList.length})
            </button>
            {showSaves && (
              <div style={{maxWidth:'500px', margin:'20px auto'}}>
                {savesList.map(s => (
                  <div key={s.slotId} className="card" style={{display:'flex', justifyContent:'space-between',
                       alignItems:'center', marginBottom:'10px', cursor:'pointer'}}
                       onClick={() => continueGame(s.slotId)}>
                    <div style={{textAlign:'right'}}>
                      <div style={{fontWeight:700}}>{s.label}</div>
                      <div style={{fontSize:'.75rem', color:'var(--text2)'}}>{new Date(s.savedAt).toLocaleString('ar-EG')}</div>
                    </div>
                    <i className="fas fa-play" style={{color:'var(--gold)'}}></i>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
        <CountrySelector onSelect={startCountry} />
      </div>
    );
  }

  const ind = state.indicators, eco = state.economy, pop = state.population, mil = state.military;
  const snapshots = state.history.turnSnapshots;

  const indicatorBoxes = [
    { label:'الناتج المحلي', value:(eco.gdp/1e9).toFixed(1)+' مليار', icon:'fa-chart-line', color:'var(--success)' },
    { label:'التضخم', value:eco.inflationRate.toFixed(1)+'%', icon:'fa-percent', color:'var(--warning)' },
    { label:'البطالة', value:pop.unemploymentRate.toFixed(1)+'%', icon:'fa-user-slash', color:'var(--error)' },
    { label:'شعبية الرئيس', value:Math.round(ind.presidentPopularity)+'%', icon:'fa-star', color:'var(--gold)' },
    { label:'الأمن', value:Math.round(ind.security), icon:'fa-shield-alt', color:'var(--success)' },
    { label:'الفساد', value:Math.round(ind.corruptionIndex), icon:'fa-exclamation-triangle', color:'var(--error)' },
    { label:'الدين/الناتج', value:eco.debtToGdpRatio+'%', icon:'fa-file-invoice-dollar', color:'var(--warning)' },
    { label:'التصنيف الائتماني', value:eco.creditRating, icon:'fa-award', color:'var(--gold)' },
    { label:'القوة العسكرية', value:mil.overallMilitaryPower+'/100', icon:'fa-fighter-jet', color:'var(--success)' },
  ];

  return (
    <div style={{minHeight:'100vh', padding:'0 0 60px'}}>
      {/* ===== الهيدر ===== */}
      <div style={{background:'linear-gradient(135deg,var(--navy),var(--navy2))', padding:'26px 30px',
                    display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'16px',
                    borderBottom:'1px solid var(--border)'}}>
        <div style={{display:'flex', alignItems:'center', gap:'14px'}}>
          <div style={{fontSize:'2.2rem'}}>{state.meta.flag || '🏛️'}</div>
          <div>
            <h2 style={{fontSize:'1.3rem', fontWeight:800}}>{state.meta.name}</h2>
            <div style={{fontSize:'.8rem', color:'var(--text2)'}}>
              الجولة {state.meta.turnCount} — {state.meta.simulationDate}
            </div>
          </div>
        </div>
        <div style={{display:'flex', gap:'10px'}}>
          <button className="btn btn-outline" onClick={manualSave}><i className="fas fa-save"></i> حفظ</button>
          <button className="btn btn-gold" onClick={advanceTurn} disabled={eventLoading}>
            <i className="fas fa-forward"></i> الجولة التالية
          </button>
        </div>
      </div>

      <div style={{maxWidth:'1300px', margin:'30px auto', padding:'0 24px'}}>
        {/* ===== شريط المؤشرات ===== */}
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))', gap:'16px', marginBottom:'30px'}}>
          {indicatorBoxes.map((b, i) => (
            <div key={i} className="card" style={{textAlign:'center'}}>
              <i className={`fas ${b.icon}`} style={{color:b.color, fontSize:'1.2rem', marginBottom:'8px'}}></i>
              <div style={{fontSize:'1.3rem', fontWeight:800}}>{b.value}</div>
              <div style={{fontSize:'.72rem', color:'var(--text2)', marginTop:'4px'}}>{b.label}</div>
            </div>
          ))}
        </div>

        <div style={{display:'grid', gridTemplateColumns:'1.3fr 1fr', gap:'22px'}}>
          {/* ===== الرسوم البيانية ===== */}
          <div className="card">
            <h4 style={{marginBottom:'18px', color:'var(--gold-light)'}}><i className="fas fa-chart-area"></i> تطور المؤشرات عبر الزمن</h4>
            <MiniLineChart data={snapshots} dataKey="gdp" color="#27AE60" label="الناتج المحلي" />
            <MiniLineChart data={snapshots} dataKey="inflation" color="#F4B400" label="التضخم" />
            <MiniLineChart data={snapshots} dataKey="unemployment" color="#E53935" label="البطالة" />
            <MiniLineChart data={snapshots} dataKey="popularity" color="#C89A2B" label="شعبية الرئيس" />
          </div>

          {/* ===== سجل الأحداث والقرارات ===== */}
          <div className="card">
            <h4 style={{marginBottom:'18px', color:'var(--gold-light)'}}><i className="fas fa-history"></i> السجل الزمني</h4>
            <div style={{maxHeight:'340px', overflowY:'auto', display:'flex', flexDirection:'column', gap:'10px'}}>
              {[...state.history.decisionsLog, ...state.history.eventsLog]
                .sort((a,b) => b.turn - a.turn)
                .slice(0, 15)
                .map((item, i) => (
                <div key={i} style={{background:'rgba(255,255,255,0.03)', borderRight:'3px solid var(--gold)',
                                      padding:'10px 14px', borderRadius:'10px', fontSize:'.82rem'}}>
                  <div style={{fontWeight:700}}>{item.label || item.type}</div>
                  <div style={{color:'var(--text2)', fontSize:'.72rem', marginTop:'2px'}}>الجولة {item.turn} — {item.date}</div>
                </div>
              ))}
              {state.history.decisionsLog.length === 0 && state.history.eventsLog.length === 0 && (
                <div style={{color:'var(--text2)', textAlign:'center', padding:'20px'}}>لا يوجد سجل بعد</div>
              )}
            </div>
          </div>
        </div>
      </div>

      <EventModal event={currentEvent} loading={eventLoading} onChoice={handleEventChoice} />

      {notice && (
        <div style={{position:'fixed', bottom:'26px', left:'50%', transform:'translateX(-50%)',
                     background:'var(--card)', border:'1px solid var(--gold)', padding:'12px 26px',
                     borderRadius:'40px', zIndex:10000, fontSize:'.85rem'}}>
          {notice}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
</html>
